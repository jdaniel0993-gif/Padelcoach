  const clampField=(skillId,key)=>{const val=local[skillId]?.[key];if(val===""||val===undefined){setLocal(prev=>({...prev,[skillId]:{...prev[skillId],[key]:thresholds[skillId]?.[key]??DEFAULT_THRESHOLDS[skillId][key]}}));return;}if(val==="NA"||val==="na") return;const n=Math.max(0,Math.min(10,parseInt(val)||0));setLocal(prev=>({...prev,[skillId]:{...prev[skillId],[key]:String(n)}}));};
  const save=async()=>{if(coachRole!=="admin"){alert("Solo el admin puede modificar los umbrales");return;}setSaving(true);const rows=ALL_SKILLS.map(s=>({club_id:CLUB_ID,skill_id:s.id,quinta:local[s.id]?.quinta??"5",cuarta:local[s.id]?.cuarta??"5",tercera:local[s.id]?.tercera??"5",segunda:local[s.id]?.segunda??"7",primera:local[s.id]?.primera??"8",open:local[s.id]?.open??"9"}));await fetch(`${SUPABASE_URL}/rest/v1/thresholds`,{method:"POST",headers:{...sb.headers(token),"Prefer":"resolution=merge-duplicates"},body:JSON.stringify(rows)});onThresholdsUpdate(local);setSaving(false);setSaved(true);setTimeout(()=>setSaved(false),2000);};
  const reset=()=>{setLocal(JSON.parse(JSON.stringify(DEFAULT_THRESHOLDS)));setSaved(false);};
  return(
    <div style={{padding:"16px 16px 90px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}><div style={{fontSize:22,fontWeight:800,color:C.text}}>Configuración</div><button onClick={onSignOut} style={{background:C.danger+"22",color:C.danger,border:`1px solid ${C.danger}44`,borderRadius:10,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Salir</button></div>
      <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Coach: <strong style={{color:C.text}}>{coachName}</strong> · {coachRole==="admin"?"Admin":"Coach"} · {clubName||"..."}</div>

// ── CLUB TAB ─────────────────────────────────────────────────────────────────
function ClubTab({token,coachId,coachRole,clubName}) {
  const [coaches,setCoaches]=useState([]); const [loading,setLoading]=useState(true);
  const [showAdd,setShowAdd]=useState(false); const [form,setForm]=useState({name:"",email:"",phone:"",role:"coach"});
  const [saving,setSaving]=useState(false); const [toast,setToast]=useState(""); const [confirm,setConfirm]=useState(null);
  const [selectedCoach,setSelectedCoach]=useState(null);
  const [createdInfo,setCreatedInfo]=useState(null); const [copied,setCopied]=useState(false);
  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(""),2500);};
  const load=useCallback(async()=>{setLoading(true);const data=await sb.get(token,"coaches",`?club_id=eq.${CLUB_ID}&order=name.asc`);setCoaches(Array.isArray(data)?data:[]);setLoading(false);},[token]);
  useEffect(()=>{load();},[load]);
  const addCoach=async()=>{
    if(!form.name.trim()){showToast("El nombre es obligatorio","error");return;}
    setSaving(true);
    const created=await sb.post(token,"coaches",{club_id:CLUB_ID,name:form.name.trim(),email:form.email.trim()||null,phone:form.phone.trim()||null,role:form.role,inactive:false});
    const newCoach=Array.isArray(created)?created[0]:created;
    // Si hay email, intentamos crear también el acceso (Auth) del coach
    if(newCoach?.id && form.email.trim()){
      try{
        const r=await fetch(`${SUPABASE_URL}/functions/v1/create-coach-auth`,{
          method:"POST",
          headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`},
          body:JSON.stringify({email:form.email.trim(),coach_id:newCoach.id})
        });
        const authResult=await r.json();
        if(!r.ok||authResult.error){
          console.error("create-coach-auth error:",authResult.error);
          showToast("Coach creado, pero falló crear su acceso: "+(authResult.error||"error desconocido"),"error");
        } else {
          setCreatedInfo({name:form.name.trim(),email:form.email.trim(),tempPassword:authResult.temp_password});
        }
      }catch(e){
        console.error("Fallo llamando a create-coach-auth:",e);
        showToast("Coach creado, pero falló crear su acceso: "+e.message,"error");
      }
    } else {
      showToast("✅ Coach agregado (sin email, sin acceso creado)");
    }
    setSaving(false);setForm({name:"",email:"",phone:"",role:"coach"});setShowAdd(false);load();
  };
  const toggleCoach=async(c)=>{const nowInactive=!c.inactive;await sb.patch(token,"coaches",c.id,{inactive:nowInactive});load();setConfirm(null);setSelectedCoach(null);showToast(nowInactive?"Coach desactivado":"Coach reactivado");};
  if(selectedCoach) return <CoachProfile coach={selectedCoach} token={token} currentCoachId={coachId} viewerRole={coachRole} clubName={clubName} onBack={()=>setSelectedCoach(null)} onToggle={toggleCoach} onSaved={async(updated)=>{setSelectedCoach(updated);await load();}}/>;
  const activeCoaches=coaches.filter(c=>!c.inactive); const inactiveCoaches=coaches.filter(c=>c.inactive);
  return(
    <div style={{padding:"16px 16px 90px"}}>
      {toast.msg&&<Toast msg={toast.msg} type={toast.type}/>}
      {confirm&&<ConfirmDialog {...confirm} onCancel={()=>setConfirm(null)}/>}
      {createdInfo&&(
        <div style={{background:C.success+"18",border:`1px solid ${C.success}66`,borderRadius:14,padding:16,marginBottom:16}}>
          <div style={{fontSize:14,fontWeight:800,color:C.success,marginBottom:8}}>✅ Coach y acceso creados</div>
          <div style={{fontSize:12,color:C.text,marginBottom:10,lineHeight:1.5}}>Comparte estos datos con <strong>{createdInfo.name}</strong> ({createdInfo.email}). Esta contraseña <strong>no se vuelve a mostrar</strong> — si se pierde, puede resetearla desde "¿Olvidaste tu contraseña?" en el login.</div>
          <div style={{display:"flex",alignItems:"center",gap:8,background:C.bg,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px",marginBottom:12}}>

  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(""),2500);};

      <div style={{display:"flex",gap:10,alignItems:"center",fontSize:11,color:C.muted,flexWrap:"wrap"}}>
        <span>👤 {ex.players_required||"—"} alumno{ex.players_required===1?"":"s"}</span>
        <span>· {ex.source==="ai_generated"?"🤖 Generado por IA":creatorName?`👨‍🏫 ${creatorName}`:"👨‍🏫 Coach"}</span>
      </div>
      {ex.status==="rejected"&&ex.rejection_reason&&(<div style={{marginTop:8,background:C.danger+"11",border:`1px solid ${C.danger}33`,borderRadius:8,padding:"6px 10px",fontSize:11,color:C.danger}}>❌ Rechazado: {ex.rejection_reason}</div>)}
      {ex.coach_feedback_note&&(
        <div style={{marginTop:8,background:C.warning+"11",border:`1px solid ${C.warning}33`,borderRadius:8,padding:"6px 10px",fontSize:11,color:C.warning,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
          <div>💬 {feedbackAuthor?<strong>{feedbackAuthor}: </strong>:null}{ex.coach_feedback_note}</div>
          {canDeleteFeedback&&<button onClick={()=>onDeleteFeedback(ex)} style={{flexShrink:0,background:"none",border:"none",color:C.warning,cursor:"pointer",fontSize:12,opacity:0.8}}>🗑</button>}
        </div>
      )}
      {extra}
    </div>
  );
}

function SuggestExerciseForm({token,coachId,coachRole,editTarget,onDone,onCancel}) {
  const isEdit=!!editTarget;
  const [form,setForm]=useState(isEdit?{
    name:editTarget.name||"", description:editTarget.description||"",
    min_category:editTarget.min_category||"5ta Fuerza", max_category:editTarget.max_category||"Open",
    players_required:editTarget.players_required||1, skills:editTarget.skills||[],
  }:{name:"",description:"",min_category:"5ta Fuerza",max_category:"Open",players_required:1,skills:[]});
  const [saving,setSaving]=useState(false);
  const toggleSkill=(id)=>setForm(f=>({...f,skills:f.skills.includes(id)?f.skills.filter(s=>s!==id):[...f.skills,id]}));
  const save=async()=>{
    if(!form.name.trim()||!form.skills.length){alert("Nombre y al menos 1 skill son requeridos.");return;}
    setSaving(true);
    const payload={
      name:form.name.trim(), description:form.description.trim(),
      min_category:form.min_category, max_category:form.max_category,
      skills:form.skills, players_required:Number(form.players_required),
    };
    if(isEdit){
      await sb.patch(token,"exercise_catalog",editTarget.id,payload);
    } else {
      const isAdmin=coachRole==="admin";
      await sb.post(token,"exercise_catalog",{...payload,source:"coach_created",status:isAdmin?"approved":"pending_review",approved_by:isAdmin?coachId:null,created_by:coachId});
    }
    setSaving(false); onDone();
  };
  return (
    <div style={{background:C.card,borderRadius:14,padding:16,border:`1px solid ${C.accent}44`,marginBottom:16}}>
      <div style={{fontSize:14,fontWeight:800,color:C.accent,marginBottom:10}}>{isEdit?"✏️ Editar ejercicio":"💡 Sugerir ejercicio"}</div>
      <input placeholder="Nombre del ejercicio" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} style={inp}/>
      <textarea placeholder="Descripción: cómo se hace, qué busca entrenar..." value={form.description} onChange={e=>setForm({...form,description:e.target.value})} rows={4} style={{...inp,resize:"none"}}/>
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <div style={{flex:1}}><div style={{fontSize:10,color:C.muted,marginBottom:4,fontWeight:700}}>DESDE</div><select value={form.min_category} onChange={e=>setForm({...form,min_category:e.target.value})} style={inp}>{FUERZAS.map(f=><option key={f} value={f}>{f}</option>)}</select></div>
        <div style={{flex:1}}><div style={{fontSize:10,color:C.muted,marginBottom:4,fontWeight:700}}>HASTA</div><select value={form.max_category} onChange={e=>setForm({...form,max_category:e.target.value})} style={inp}>{FUERZAS.map(f=><option key={f} value={f}>{f}</option>)}</select></div>
        <div style={{width:90}}><div style={{fontSize:10,color:C.muted,marginBottom:4,fontWeight:700}}># ALUMNOS</div><select value={form.players_required} onChange={e=>setForm({...form,players_required:e.target.value})} style={inp}>{[1,2,3,4].map(n=><option key={n} value={n}>{n}</option>)}</select></div>
      </div>
      <div style={{fontSize:10,color:C.muted,marginBottom:6,fontWeight:700}}>SKILLS QUE TRABAJA</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
        {ALL_SKILLS.map(s=>(<button key={s.id} onClick={()=>toggleSkill(s.id)} style={{padding:"5px 10px",borderRadius:20,fontSize:11,fontWeight:700,cursor:"pointer",border:`1px solid ${form.skills.includes(s.id)?s.categoryColor:C.border}`,background:form.skills.includes(s.id)?s.categoryColor+"33":C.bg,color:form.skills.includes(s.id)?s.categoryColor:C.muted}}>{s.label}</button>))}
      </div>
      {!isEdit&&coachRole!=="admin"&&(<div style={{background:C.warning+"11",border:`1px solid ${C.warning}44`,borderRadius:10,padding:"8px 12px",marginBottom:12,fontSize:11,color:C.warning}}>ℹ️ Tu sugerencia entrará a revisión del head coach antes de aparecer en el catálogo.</div>)}
      <div style={{display:"flex",gap:8}}>
        <button onClick={onCancel} style={{...btnS,flex:1}}>Cancelar</button>
        <button onClick={save} disabled={saving} style={{...btnP,flex:1,opacity:saving?0.7:1}}>{saving?"Guardando...":isEdit?"Guardar cambios":"Guardar"}</button>
      </div>
    </div>
  );
}

function ExerciseCatalogTab({token,coachId,coachRole}) {
  const [exercises,setExercises]=useState([]);
  const [coachMap,setCoachMap]=useState({});
  const [loading,setLoading]=useState(true);
  const [view,setView]=useState("approved"); // approved | pending
  const [showSuggest,setShowSuggest]=useState(false);
  const [feedbackTarget,setFeedbackTarget]=useState(null);
  const [feedbackText,setFeedbackText]=useState("");
  const [rejectTarget,setRejectTarget]=useState(null);
  const [rejectReason,setRejectReason]=useState("");
  const [showFilters,setShowFilters]=useState(false);
  const [filterCategory,setFilterCategory]=useState("all");
  const [filterPlayers,setFilterPlayers]=useState("all");
  const [filterSkills,setFilterSkills]=useState([]);
  const [editTarget,setEditTarget]=useState(null);
  const [deleteTarget,setDeleteTarget]=useState(null);
  const isAdmin=coachRole==="admin";

  const load=async()=>{
    setLoading(true);
    const [data,coachesData]=await Promise.all([
      sb.get(token,"exercise_catalog","?order=created_at.desc"),
      sb.get(token,"coaches","?select=id,name"),
    ]);
    setExercises(Array.isArray(data)?data:[]);
    if(Array.isArray(coachesData)) setCoachMap(Object.fromEntries(coachesData.map(c=>[c.id,c.name])));
    setLoading(false);
  };
  useEffect(()=>{load();},[token]);

  const toggleFilterSkill=(id)=>setFilterSkills(f=>f.includes(id)?f.filter(s=>s!==id):[...f,id]);
  const clearFilters=()=>{setFilterCategory("all");setFilterPlayers("all");setFilterSkills([]);};
  const activeFilterCount=(filterCategory!=="all"?1:0)+(filterPlayers!=="all"?1:0)+(filterSkills.length>0?1:0);

  const matchesFilters=(ex)=>{
    if(filterCategory!=="all"){
      const idx=FUERZAS.indexOf(filterCategory), minIdx=FUERZAS.indexOf(ex.min_category), maxIdx=FUERZAS.indexOf(ex.max_category);
      if(idx<minIdx||idx>maxIdx) return false;
    }
    if(filterPlayers!=="all" && String(ex.players_required)!==String(filterPlayers)) return false;
    if(filterSkills.length && !(ex.skills||[]).some(s=>filterSkills.includes(s))) return false;
    return true;
  };

  const approved=exercises.filter(e=>e.status==="approved").filter(matchesFilters);
  const pending=exercises.filter(e=>e.status==="pending_review").filter(matchesFilters);
  const archived=exercises.filter(e=>e.status==="archived"||e.status==="rejected").filter(matchesFilters);
  const approvedTotal=exercises.filter(e=>e.status==="approved").length;
  const pendingTotal=exercises.filter(e=>e.status==="pending_review").length;
  const archivedTotal=exercises.filter(e=>e.status==="archived"||e.status==="rejected").length;

  const approve=async(ex)=>{await sb.patch(token,"exercise_catalog",ex.id,{status:"approved",approved_by:coachId});load();};
  const archiveExercise=async(ex)=>{await sb.patch(token,"exercise_catalog",ex.id,{status:"archived"});load();};
  const restoreExercise=async(ex)=>{await sb.patch(token,"exercise_catalog",ex.id,{status:"approved",rejection_reason:null});load();};
  const confirmDelete=async()=>{await sb.delete(token,"exercise_catalog",deleteTarget.id);setDeleteTarget(null);load();};
  const deleteFeedback=async(ex)=>{await sb.patch(token,"exercise_catalog",ex.id,{coach_feedback_note:null,coach_feedback_id:null,coach_feedback_at:null});load();};
  const confirmReject=async()=>{
    if(!rejectReason.trim()){alert("Escribe el motivo del rechazo.");return;}
    await sb.patch(token,"exercise_catalog",rejectTarget.id,{status:"rejected",rejection_reason:rejectReason.trim(),approved_by:coachId});
    setRejectTarget(null); setRejectReason(""); load();
  };
  const submitFeedback=async()=>{
    if(!feedbackText.trim())return;
    await sb.patch(token,"exercise_catalog",feedbackTarget.id,{coach_feedback_note:feedbackText.trim(),coach_feedback_id:coachId,coach_feedback_at:new Date().toISOString()});
    setFeedbackTarget(null); setFeedbackText(""); load();
  };

  if(loading) return <div style={{padding:60,textAlign:"center"}}><Spinner/></div>;

  return (
    <div style={{padding:16,paddingBottom:90}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontSize:18,fontWeight:800,color:C.text}}>📚 Catálogo de Ejercicios</div>
        <button onClick={()=>setShowSuggest(s=>!s)} style={{background:C.accent,color:C.bg,border:"none",borderRadius:12,padding:"8px 14px",fontWeight:800,fontSize:12,cursor:"pointer"}}>+ Sugerir</button>
      </div>

      {(showSuggest||editTarget)&&<SuggestExerciseForm token={token} coachId={coachId} coachRole={coachRole} editTarget={editTarget} onCancel={()=>{setShowSuggest(false);setEditTarget(null);}} onDone={()=>{setShowSuggest(false);setEditTarget(null);load();}}/>}

      <button onClick={()=>setShowFilters(s=>!s)} style={{display:"flex",alignItems:"center",gap:6,background:showFilters||activeFilterCount?C.accent+"22":C.card,color:showFilters||activeFilterCount?C.accent:C.muted,border:`1px solid ${showFilters||activeFilterCount?C.accent:C.border}`,borderRadius:10,padding:"8px 12px",fontWeight:700,fontSize:12,cursor:"pointer",marginBottom:showFilters?10:16}}>
        🔍 Filtros{activeFilterCount>0?` (${activeFilterCount})`:""}
      </button>

      {showFilters&&(
        <div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.border}`,marginBottom:16}}>
          <div style={{fontSize:10,color:C.muted,marginBottom:6,fontWeight:700}}>CATEGORÍA</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
            <button onClick={()=>setFilterCategory("all")} style={{padding:"5px 10px",borderRadius:20,fontSize:11,fontWeight:700,cursor:"pointer",border:`1px solid ${filterCategory==="all"?C.accent:C.border}`,background:filterCategory==="all"?C.accent+"33":C.bg,color:filterCategory==="all"?C.accent:C.muted}}>Todas</button>
            {FUERZAS.map(f=>(<button key={f} onClick={()=>setFilterCategory(f)} style={{padding:"5px 10px",borderRadius:20,fontSize:11,fontWeight:700,cursor:"pointer",border:`1px solid ${filterCategory===f?C.accent:C.border}`,background:filterCategory===f?C.accent+"33":C.bg,color:filterCategory===f?C.accent:C.muted}}>{f}</button>))}
          </div>
          <div style={{fontSize:10,color:C.muted,marginBottom:6,fontWeight:700}}># ALUMNOS</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
            <button onClick={()=>setFilterPlayers("all")} style={{padding:"5px 10px",borderRadius:20,fontSize:11,fontWeight:700,cursor:"pointer",border:`1px solid ${filterPlayers==="all"?C.accent:C.border}`,background:filterPlayers==="all"?C.accent+"33":C.bg,color:filterPlayers==="all"?C.accent:C.muted}}>Todos</button>
            {[1,2,3,4].map(n=>(<button key={n} onClick={()=>setFilterPlayers(n)} style={{padding:"5px 10px",borderRadius:20,fontSize:11,fontWeight:700,cursor:"pointer",border:`1px solid ${filterPlayers===n?C.accent:C.border}`,background:filterPlayers===n?C.accent+"33":C.bg,color:filterPlayers===n?C.accent:C.muted}}>{n}</button>))}
          </div>
          <div style={{fontSize:10,color:C.muted,marginBottom:6,fontWeight:700}}>SKILLS (cualquiera de las seleccionadas)</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:activeFilterCount?14:0}}>
            {ALL_SKILLS.map(s=>(<button key={s.id} onClick={()=>toggleFilterSkill(s.id)} style={{padding:"5px 10px",borderRadius:20,fontSize:11,fontWeight:700,cursor:"pointer",border:`1px solid ${filterSkills.includes(s.id)?s.categoryColor:C.border}`,background:filterSkills.includes(s.id)?s.categoryColor+"33":C.bg,color:filterSkills.includes(s.id)?s.categoryColor:C.muted}}>{s.label}</button>))}
          </div>
          {activeFilterCount>0&&(<button onClick={clearFilters} style={{...btnS,marginTop:0}}>Limpiar filtros</button>)}
        </div>
      )}

      {isAdmin&&(
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          <button onClick={()=>setView("approved")} style={{flex:1,padding:"9px 0",borderRadius:10,background:view==="approved"?C.accent+"22":C.card,color:view==="approved"?C.accent:C.muted,border:`1px solid ${view==="approved"?C.accent:C.border}`,fontWeight:800,fontSize:12,cursor:"pointer"}}>✅ Aprobados ({activeFilterCount?`${approved.length}/${approvedTotal}`:approvedTotal})</button>
          <button onClick={()=>setView("pending")} style={{flex:1,padding:"9px 0",borderRadius:10,background:view==="pending"?C.warning+"22":C.card,color:view==="pending"?C.warning:C.muted,border:`1px solid ${view==="pending"?C.warning:C.border}`,fontWeight:800,fontSize:12,cursor:"pointer"}}>🕓 Revisión ({activeFilterCount?`${pending.length}/${pendingTotal}`:pendingTotal})</button>
          <button onClick={()=>setView("archive")} style={{flex:1,padding:"9px 0",borderRadius:10,background:view==="archive"?C.muted+"22":C.card,color:view==="archive"?C.text:C.muted,border:`1px solid ${view==="archive"?C.muted:C.border}`,fontWeight:800,fontSize:12,cursor:"pointer"}}>🗄️ Archivo ({activeFilterCount?`${archived.length}/${archivedTotal}`:archivedTotal})</button>
        </div>
      )}

      {(!isAdmin||view==="approved")&&(
        approved.length===0
          ? <div style={{textAlign:"center",padding:60,color:C.muted}}><div style={{fontSize:40,marginBottom:12}}>{activeFilterCount?"🔍":"📚"}</div><div style={{fontSize:14,fontWeight:600}}>{activeFilterCount?"Sin resultados con estos filtros":"Sin ejercicios aprobados aún"}</div>{activeFilterCount>0&&<button onClick={clearFilters} style={{...btnS,width:"auto",marginTop:14,padding:"8px 16px"}}>Limpiar filtros</button>}</div>
          : approved.map(ex=>(
            <ExerciseCard key={ex.id} ex={ex} coachMap={coachMap} coachId={coachId} coachRole={coachRole} onDeleteFeedback={deleteFeedback} extra={
              isAdmin?(
                <div style={{display:"flex",gap:6,marginTop:10}}>
                  <button onClick={()=>setEditTarget(ex)} style={{flex:1,background:C.blue+"22",color:C.blue,border:`1px solid ${C.blue}44`,borderRadius:8,padding:"6px 0",fontSize:11,fontWeight:700,cursor:"pointer"}}>✏️ Editar</button>
                  <button onClick={()=>archiveExercise(ex)} style={{flex:1,background:C.muted+"22",color:C.muted,border:`1px solid ${C.muted}44`,borderRadius:8,padding:"6px 0",fontSize:11,fontWeight:700,cursor:"pointer"}}>🗄️ Archivar</button>
                  <button onClick={()=>setDeleteTarget(ex)} style={{flex:1,background:C.danger+"22",color:C.danger,border:`1px solid ${C.danger}44`,borderRadius:8,padding:"6px 0",fontSize:11,fontWeight:700,cursor:"pointer"}}>🗑️ Eliminar</button>
                </div>
              ):(<button onClick={()=>{setFeedbackTarget(ex);setFeedbackText("");}} style={{marginTop:10,background:C.blue+"22",color:C.blue,border:`1px solid ${C.blue}44`,borderRadius:8,padding:"6px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>💬 Dar feedback</button>)
            }/>
          ))
      )}

      {isAdmin&&view==="pending"&&(
        pending.length===0
          ? <div style={{textAlign:"center",padding:60,color:C.muted}}><div style={{fontSize:40,marginBottom:12}}>🕓</div><div style={{fontSize:14,fontWeight:600}}>Sin ejercicios pendientes de revisión</div></div>
          : pending.map(ex=>(
            <ExerciseCard key={ex.id} ex={ex} coachMap={coachMap} coachId={coachId} coachRole={coachRole} onDeleteFeedback={deleteFeedback} extra={
              <div style={{display:"flex",gap:8,marginTop:10}}>
                <button onClick={()=>approve(ex)} style={{flex:1,background:C.success+"22",color:C.success,border:`1px solid ${C.success}44`,borderRadius:8,padding:"7px 0",fontSize:12,fontWeight:800,cursor:"pointer"}}>✅ Aprobar</button>
                <button onClick={()=>{setRejectTarget(ex);setRejectReason("");}} style={{flex:1,background:C.danger+"22",color:C.danger,border:`1px solid ${C.danger}44`,borderRadius:8,padding:"7px 0",fontSize:12,fontWeight:800,cursor:"pointer"}}>❌ Rechazar</button>
              </div>
            }/>
          ))
      )}

      {isAdmin&&view==="archive"&&(
        archived.length===0
          ? <div style={{textAlign:"center",padding:60,color:C.muted}}><div style={{fontSize:40,marginBottom:12}}>🗄️</div><div style={{fontSize:14,fontWeight:600}}>Sin ejercicios archivados</div></div>
          : archived.map(ex=>(
            <ExerciseCard key={ex.id} ex={ex} coachMap={coachMap} coachId={coachId} coachRole={coachRole} onDeleteFeedback={deleteFeedback} extra={
              <div style={{display:"flex",gap:6,marginTop:10}}>
                <button onClick={()=>restoreExercise(ex)} style={{flex:1,background:C.success+"22",color:C.success,border:`1px solid ${C.success}44`,borderRadius:8,padding:"6px 0",fontSize:11,fontWeight:700,cursor:"pointer"}}>♻️ Restaurar</button>
                <button onClick={()=>setDeleteTarget(ex)} style={{flex:1,background:C.danger+"22",color:C.danger,border:`1px solid ${C.danger}44`,borderRadius:8,padding:"6px 0",fontSize:11,fontWeight:700,cursor:"pointer"}}>🗑️ Eliminar</button>
              </div>
            }/>
          ))
      )}

      {deleteTarget&&<ConfirmDialog title="¿Eliminar ejercicio?" message={`"${deleteTarget.name}" se eliminará permanentemente del catálogo. No se puede deshacer.`} confirmLabel="Eliminar" danger onConfirm={confirmDelete} onCancel={()=>setDeleteTarget(null)}/>}

      {feedbackTarget&&(
        <div style={{position:"fixed",inset:0,background:"#000000aa",display:"flex",alignItems:"flex-end",zIndex:200}} onClick={()=>setFeedbackTarget(null)}>
          <div style={{background:C.surface,borderRadius:"20px 20px 0 0",padding:20,width:"100%"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:14,fontWeight:800,color:C.text,marginBottom:4}}>Feedback sobre "{feedbackTarget.name}"</div>
            <div style={{fontSize:11,color:C.muted,marginBottom:12}}>Ej. "Muy avanzado para 5ta Fuerza" o "Funciona mejor con efectos desde 3ra".</div>
            <textarea autoFocus value={feedbackText} onChange={e=>setFeedbackText(e.target.value)} rows={3} style={{...inp,resize:"none"}}/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setFeedbackTarget(null)} style={{...btnS,flex:1}}>Cancelar</button>
              <button onClick={submitFeedback} style={{...btnP,flex:1}}>Enviar</button>
            </div>
          </div>
        </div>
      )}

      {rejectTarget&&(
        <div style={{position:"fixed",inset:0,background:"#000000aa",display:"flex",alignItems:"flex-end",zIndex:200}} onClick={()=>setRejectTarget(null)}>
          <div style={{background:C.surface,borderRadius:"20px 20px 0 0",padding:20,width:"100%"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:14,fontWeight:800,color:C.text,marginBottom:4}}>Rechazar "{rejectTarget.name}"</div>
            <div style={{fontSize:11,color:C.muted,marginBottom:12}}>El ejercicio queda archivado, no se borra — puede aprobarse luego para otro rango de categoría.</div>
            <textarea autoFocus placeholder="Motivo del rechazo..." value={rejectReason} onChange={e=>setRejectReason(e.target.value)} rows={3} style={{...inp,resize:"none"}}/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setRejectTarget(null)} style={{...btnS,flex:1}}>Cancelar</button>
              <button onClick={confirmReject} style={{...btnP,flex:1,background:C.danger}}>Rechazar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App() {
  const [token,setToken]=useState(()=>localStorage.getItem("pc_token")||null);
  const [userId,setUserId]=useState(()=>localStorage.getItem("pc_user_id")||null);
  const [coach,setCoach]=useState(null); const [playerSession,setPlayerSession]=useState(null);
  const [clubName,setClubName]=useState("");
  const [bootstrapError,setBootstrapError]=useState("");
  const [thresholds,setThresholds]=useState(DEFAULT_THRESHOLDS); const [tab,setTab]=useState("players");
  const [selectedPlayer,setSelectedPlayer]=useState(null); const [loading,setLoading]=useState(true);
  const [recoveryToken,setRecoveryToken]=useState(()=>{
    const hash = window.location.hash || "";
    if(hash.includes("type=recovery")){
      const params = new URLSearchParams(hash.replace(/^#/,""));
      return params.get("access_token") || null;
    }
    return null;
  });

  useEffect(()=>{
    if(!token||!userId){setLoading(false);return;}
    (async()=>{
    const coaches = await sb.get(token,"coaches",`?user_id=eq.${userId}&limit=1`);
      if(coaches&&Array.isArray(coaches)&&coaches.length){
        CLUB_ID = coaches[0].club_id;
        setCoach(coaches[0]);
        const [thresh,clubRow] = await Promise.all([sb.get(token,"thresholds",`?club_id=eq.${CLUB_ID}`),sb.get(token,"clubs",`?id=eq.${CLUB_ID}&select=name&limit=1`)]);
        if(clubRow&&clubRow.length) setClubName(clubRow[0].name);
        if(thresh&&thresh.length){const t={...DEFAULT_THRESHOLDS};for(const row of thresh)t[row.skill_id]={quinta:row.quinta??"5",cuarta:row.cuarta??"5",tercera:row.tercera??"5",segunda:row.segunda??"7",primera:row.primera??"8",open:row.open??"9"};setThresholds(t);}
        setLoading(false);
        return;
      }
      const players = await sb.get(token,"players",`?user_id=eq.${userId}&limit=1`);
      if(players&&Array.isArray(players)&&players.length){
        CLUB_ID = players[0].club_id;
        setPlayerSession(players[0]);
        const [thresh,clubRow] = await Promise.all([sb.get(token,"thresholds",`?club_id=eq.${CLUB_ID}`),sb.get(token,"clubs",`?id=eq.${CLUB_ID}&select=name&limit=1`)]);
        if(clubRow&&clubRow.length) setClubName(clubRow[0].name);
        if(thresh&&thresh.length){const t={...DEFAULT_THRESHOLDS};for(const row of thresh)t[row.skill_id]={quinta:row.quinta??"5",cuarta:row.cuarta??"5",tercera:row.tercera??"5",segunda:row.segunda??"7",primera:row.primera??"8",open:row.open??"9"};setThresholds(t);}
        setLoading(false);
        return;
      }
      setToken(null);setUserId(null);localStorage.removeItem("pc_token");localStorage.removeItem("pc_user_id");
      setBootstrapError("Tu cuenta no tiene acceso activo. Si eres coach, es posible que tu cuenta haya sido desactivada — contacta a tu administrador.");
      setLoading(false);
    })();
  },[token,userId]);

  const handleLogin=(tok,uid)=>{setBootstrapError("");setToken(tok);setUserId(uid);};
  const handleSignOut=async()=>{if(token)await sb.signOut(token);localStorage.removeItem("pc_token");localStorage.removeItem("pc_user_id");setToken(null);setUserId(null);setCoach(null);setSelectedPlayer(null);CLUB_ID=null;};
  const handlePlayerSignOut=async()=>{if(token)await sb.signOut(token);localStorage.removeItem("pc_token");localStorage.removeItem("pc_user_id");setToken(null);setUserId(null);setPlayerSession(null);CLUB_ID=null;};

  if(recoveryToken) return <ResetPasswordScreen recoveryToken={recoveryToken} onDone={()=>{window.location.hash="";setRecoveryToken(null);}}/>;
  if(loading) return(<div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{textAlign:"center"}}><div style={{marginBottom:16,display:"flex",justifyContent:"center"}}><svg width="40" height="40" viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg"><circle cx="0" cy="-78" r="9" fill="#C8FF00"/><circle cx="-68" cy="45" r="9" fill="#2E86C1"/><circle cx="68" cy="45" r="9" fill="#A29BFE"/><line x1="0" y1="-78" x2="-68" y2="45" stroke="#7FA8C9" strokeWidth="2.4"/><line x1="0" y1="-78" x2="68" y2="45" stroke="#7FA8C9" strokeWidth="2.4"/><line x1="-68" y1="45" x2="68" y2="45" stroke="#7FA8C9" strokeWidth="2.4"/><circle cx="0" cy="4" r="11" fill="#E8F4FD"/></svg></div><Spinner/></div></div>);
  if(playerSession) return <PlayerView player={playerSession} token={token} onSignOut={handlePlayerSignOut}/>;
  if(!token||!coach) return <LoginScreen onLogin={handleLogin} initialError={bootstrapError}/>;
  if(selectedPlayer) return(<div style={{background:C.bg,minHeight:"100vh",fontFamily:"'Inter',system-ui,sans-serif",color:C.text}}><PlayerDetail player={selectedPlayer} token={token} coachId={coach.id} coachRole={coach.role} thresholds={thresholds} onBack={()=>setSelectedPlayer(null)}/></div>);

  return(
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:"'Inter',system-ui,sans-serif",color:C.text}}>
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"16px 16px 12px",paddingTop:"max(16px,env(safe-area-inset-top,16px))"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:32,height:32,borderRadius:8,background:C.bg,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"center"}}><svg width="20" height="20" viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg"><circle cx="0" cy="-78" r="10" fill="#C8FF00"/><circle cx="-68" cy="45" r="10" fill="#2E86C1"/><circle cx="68" cy="45" r="10" fill="#A29BFE"/><line x1="0" y1="-78" x2="-68" y2="45" stroke="#7FA8C9" strokeWidth="3"/><line x1="0" y1="-78" x2="68" y2="45" stroke="#7FA8C9" strokeWidth="3"/><line x1="-68" y1="45" x2="68" y2="45" stroke="#7FA8C9" strokeWidth="3"/><circle cx="0" cy="4" r="13" fill="#E8F4FD"/></svg></div>
          <div><div style={{fontSize:16,fontWeight:800,color:C.text,lineHeight:1}}>Padel Triada</div><div style={{fontSize:10,color:C.muted}}>{clubName||"..."} · {coach.name}</div></div>
        </div>
      </div>
      {tab==="players"&&<PlayersTab token={token} coachId={coach.id} coachRole={coach.role} thresholds={thresholds} onSelectPlayer={setSelectedPlayer}/>}
      {tab==="eval"&&<EvalTab token={token} coachId={coach.id} coachRole={coach.role} onGoToPlayer={setSelectedPlayer}/>}
      {tab==="catalog"&&<ExerciseCatalogTab token={token} coachId={coach.id} coachRole={coach.role}/>}
      {tab==="club"&&coach.role==="admin"&&<ClubTab token={token} coachId={coach.id} coachRole={coach.role} clubName={clubName}/>}
      {tab==="config"&&<ConfigTab token={token} coach={coach} coachRole={coach.role} thresholds={thresholds} onThresholdsUpdate={setThresholds} coachName={coach.name} clubName={clubName} onSignOut={handleSignOut} onCoachUpdate={setCoach}/>}
      <BottomNav tab={tab} setTab={setTab} isAdmin={coach.role==="admin"}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
setTimeout(()=>{const splash=document.getElementById('splash');if(splash)splash.classList.add('hidden');},1500);
  </script>
</body>
</html>
