// ── SHARED: guardado de perfil de coach + auto-creación de Auth ───────────────
// Usado por CoachProfile (admin viendo a cualquiera) y ConfigTab→"Mi Perfil" (coach sobre sí mismo).
// Único punto de verdad para: armar el payload de update, hacer el PATCH, y disparar
// create-coach-auth cuando un coach que no tenía email/user_id agrega uno por primera vez.
async function saveCoachProfileWithAuth(token, coach, form, {allowRoleChange=false} = {}) {
  const hadNoEmail = !coach.email && !coach.user_id;
  const newEmail = form.email.trim();
  const updates = {
    name: form.name.trim(),
    email: newEmail || null,
    phone: form.phone.trim() || null,
    birthdate: form.birthdate || null,
    specialty: form.specialty.trim() || null,
    join_date: form.join_date || null,
    nationality: form.nationality.trim() || null,
  };
  if (allowRoleChange && form.role) updates.role = form.role;
  await sb.patch(token, "coaches", coach.id, updates);
  if (hadNoEmail && newEmail) {
    try {
      const r = await fetch(`${SUPABASE_URL}/functions/v1/create-coach-auth`, {
        method: "POST",
        headers: {"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`},
        body: JSON.stringify({email:newEmail, coach_id:coach.id})
      });
      const authResult = await r.json();
      if (!r.ok || authResult.error) {
        console.error("create-coach-auth error:", authResult.error);
        return { updates, toastMsg: "Perfil actualizado, pero falló crear el acceso: "+(authResult.error||"error desconocido"), toastType: "error" };
      }
      console.log("Acceso creado. Contraseña temporal:", authResult.temp_password);
      return { updates, toastMsg: "✅ Perfil y acceso creados (ver consola para contraseña temporal)", toastType: "success" };
    } catch(e) {
      console.error("Fallo llamando a create-coach-auth:", e);
      return { updates, toastMsg: "Perfil actualizado, pero falló crear el acceso: "+e.message, toastType: "error" };
    }
  }
  if (coach.user_id && newEmail && newEmail !== coach.email) {
    try {
      const r = await fetch(`${SUPABASE_URL}/functions/v1/update-coach-email`, {
        method: "POST",
        headers: {"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`},
        body: JSON.stringify({coach_id:coach.id, new_email:newEmail})
      });
      const emailResult = await r.json();
      if (!r.ok || emailResult.error) {
        console.error("update-coach-email error:", emailResult.error);
        return { updates, toastMsg: "Perfil actualizado, pero falló sincronizar el email de acceso: "+(emailResult.error||"error desconocido"), toastType: "error" };
      }
      return { updates, toastMsg: "✅ Perfil y email de acceso actualizados", toastType: "success" };
    } catch(e) {
      console.error("Fallo llamando a update-coach-email:", e);
      return { updates, toastMsg: "Perfil actualizado, pero falló sincronizar el email de acceso: "+e.message, toastType: "error" };
    }
  }
  return { updates, toastMsg: "✅ Perfil actualizado", toastType: "success" };
}

const callClaudeAPI = async (prompt) => {
  const response = await fetch(`${SUPABASE_URL}/functions/v1/ai-recommendations`, {

      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,

    body: JSON.stringify({ prompt }),
  });

  if (data.error) throw new Error(data.error);
  const text = data.text || "";
  if (!text) throw new Error("Respuesta vacía del servidor");

};

const calcSubcat = (birthdate) => {
  if(!birthdate) return null;
  const age = Math.floor((new Date() - parseLocalDate(birthdate)) / (365.25*24*3600*1000));
  if(age <= 10) return "Sub-10"; if(age <= 12) return "Sub-12"; if(age <= 14) return "Sub-14";
  if(age <= 16) return "Sub-16"; if(age <= 18) return "Sub-18"; return null;
};

const DEFAULT_THRESHOLDS = Object.fromEntries(ALL_SKILLS.map(s => [s.id, {quinta:"5",cuarta:"5",tercera:"5",segunda:"7",primera:"8",open:"9"}]));
// Determina a qué Fuerza pertenece un puntaje (0-10) para un skill específico, según sus thresholds reales (no una escala fija).
const fuerzaForScore = (thresholds, skillId, n) => {
  if (n===null||n===undefined) return null;
  const th = (thresholds && thresholds[skillId]) || DEFAULT_THRESHOLDS[skillId];
  if (!th) return null;
  for (let i = FUERZA_KEYS.length - 1; i >= 0; i--) {
    const k = FUERZA_KEYS[i]; const t = th[k];
    if (t===undefined||t===null||t===""||t==="NA"||t==="na") continue;
    if (n >= Number(t)) return k;
  }
  return FUERZA_KEYS[0]; // 5ta es el piso: si no alcanza el umbral de 4ta, sigue siendo 5ta (sin zona "sin nivel")
};
// ── SCORE LOGIC ───────────────────────────────────────────────────────────────
const computeCurrentScores = (sessions) => {
  const scores = {};
  const ordered = [...sessions].sort((a,b) => new Date(a.date)-new Date(b.date));
  for (const s of ordered) {
    if (!s.scores) continue;
    const sc = typeof s.scores === "string" ? JSON.parse(s.scores) : s.scores;
    for (const [id,val] of Object.entries(sc)) { if (val !== null) scores[id] = val; }
  }
  return scores;
};
const avgScored = scores => {
  const vals = Object.values(scores).filter(v=>v!==null&&v!==undefined);
  if (!vals.length) return null;
  return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
};
const avgCatScored = (scores, catId) => {
  const cat = SKILL_CATEGORIES.find(c=>c.id===catId);
  const vals = cat.skills.map(s=>scores[s.id]).filter(v=>v!==null&&v!==undefined);
  if (!vals.length) return null;
  return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
};
const daysSinceTrainedMap = sessions => {
  const map = {}; const now = new Date();
  for (const s of sessions) {
    if (!s.scores) continue;
    const sc = typeof s.scores === "string" ? JSON.parse(s.scores) : s.scores;
    const d = new Date(s.date+"T12:00:00");
    for (const [id,val] of Object.entries(sc)) {
      if (val !== null) { const days = Math.floor((now-d)/86400000); if (map[id]===undefined || days < map[id]) map[id] = days; }
    }
  }
  return map;
};
const heatColor = days => {
  if (days===undefined) return {bg:C.border, text:C.muted, label:"Nunca"};
  if (days<=7)  return {bg:C.success+"33", text:C.success, label:`${days}d`};
  if (days<=21) return {bg:C.warning+"33", text:C.warning, label:`${days}d`};
  return {bg:C.danger+"33", text:C.danger, label:`${days}d`};
};
const computeLevel = (currentScores, thresholds) => {
  const thresh = thresholds || DEFAULT_THRESHOLDS;
  const scoredSkills = ALL_SKILLS.filter(s => currentScores[s.id] !== undefined && currentScores[s.id] !== null);
  if (!scoredSkills.length) return { level:"Principiante", pctToNext:0, missing:[] };
  const missingAvanzado = scoredSkills.filter(s => (currentScores[s.id]||0) < thresh[s.id].avanzado);
  const missingIntermedio = scoredSkills.filter(s => (currentScores[s.id]||0) < thresh[s.id].intermedio);
  if (missingAvanzado.length === 0) return { level:"Avanzado", pctToNext:100, missing:[] };
  if (missingIntermedio.length === 0) {
    const achieved = scoredSkills.reduce((acc,s)=>acc+(currentScores[s.id]||0),0);
    const maxGap = scoredSkills.reduce((acc,s)=>acc+thresh[s.id].avanzado,0);
    return { level:"Intermedio", nextLevel:"Avanzado", pctToNext:Math.min(Math.round((achieved/maxGap)*100),99), missing: missingAvanzado.map(s=>({...s,current:currentScores[s.id]||0,needed:thresh[s.id].avanzado,gap:thresh[s.id].avanzado-(currentScores[s.id]||0)})).sort((a,b)=>a.gap-b.gap) };
  }
  const achieved = scoredSkills.reduce((acc,s)=>acc+(currentScores[s.id]||0),0);
  const maxGap = scoredSkills.reduce((acc,s)=>acc+thresh[s.id].intermedio,0);
  return { level:"Principiante", nextLevel:"Intermedio", pctToNext:Math.min(Math.round((achieved/maxGap)*100),99), missing: missingIntermedio.map(s=>({...s,current:currentScores[s.id]||0,needed:thresh[s.id].intermedio,gap:thresh[s.id].intermedio-(currentScores[s.id]||0)})).sort((a,b)=>a.gap-b.gap) };
};

const parseLocalDate = iso => {
  if(!iso) return new Date(iso);
  if(typeof iso === "string" && /^\d{4}-\d{2}-\d{2}$/.test(iso)){
    const [y,m,d] = iso.split("-").map(Number);
    return new Date(y, m-1, d);
  }
  return new Date(iso);
};
const fmtDate = iso => parseLocalDate(iso).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"});

const generateCode = () => "PAD-" + Math.floor(1000+Math.random()*9000);
// Genera un invite_code único reintentando contra la BD si hay colisión (máx 10 intentos)
const generateUniqueInviteCode = async (token) => {
  for(let attempt=0; attempt<10; attempt++){
    const code = generateCode();
    const existing = await sb.get(token,"players",`?club_id=eq.${CLUB_ID}&invite_code=eq.${code}&select=id&limit=1`);
    if(!Array.isArray(existing) || existing.length===0) return code;
  }
  // Fallback extremo: agrega sufijo de milisegundos para garantizar unicidad
  return generateCode() + "-" + String(Date.now()).slice(-3);
};

// ── RADAR ─────────────────────────────────────────────────────────────────────
function RadarChart({scores,size=260,catId=null,compareScores=null}) {
  const cats = catId?SKILL_CATEGORIES.filter(c=>c.id===catId):SKILL_CATEGORIES;
  const skills = cats.flatMap(c=>c.skills.map(s=>({...s,color:c.color})));
  const n=skills.length; if(!n) return null;
  const cx=size/2,cy=size/2,r=size*0.36;
  const angle = i=>(Math.PI*2*i)/n-Math.PI/2;
  const pt = (i,v)=>({x:cx+r*(v/10)*Math.cos(angle(i)),y:cy+r*(v/10)*Math.sin(angle(i))});
  const dp = skills.map((s,i)=>pt(i,scores[s.id]??0));
  const path = dp.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ")+"Z";
  const dp2 = compareScores?skills.map((s,i)=>pt(i,compareScores[s.id]??0)):null;
  const path2 = dp2?dp2.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ")+"Z":null;
  return (
    <svg width={size} height={size} style={{overflow:"visible"}}>
      {[2,4,6,8,10].map(lvl=>{const pts=skills.map((_,i)=>pt(i,lvl));const p2=pts.map((p,i)=>`${i===0?"M":"L"}${p.x},${p.y}`).join(" ")+"Z";return <g key={lvl}><path d={p2} fill="none" stroke={C.border} strokeWidth="1" opacity="0.6"/><text x={cx} y={cy-r*lvl/10-3} textAnchor="middle" fontSize="9" fill={C.muted}>{lvl}</text></g>;})}
      {skills.map((_,i)=>{const e=pt(i,10);return <line key={i} x1={cx} y1={cy} x2={e.x} y2={e.y} stroke={C.border} strokeWidth="1" opacity="0.5"/>;})}
      {path2&&<path d={path2} fill={C.blue} fillOpacity="0.15" stroke={C.blue} strokeWidth="1.5" strokeDasharray="4,3"/>}
      <path d={path} fill={C.accent} fillOpacity="0.15" stroke={C.accent} strokeWidth="2"/>
      {dp.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="3.5" fill={scores[skills[i].id]===null||scores[skills[i].id]===undefined?C.border:skills[i].color} stroke={C.bg} strokeWidth="1.5"/>)}
      {skills.map((s,i)=>{const lp=pt(i,11.8);return <text key={i} x={lp.x} y={lp.y} textAnchor="middle" dominantBaseline="middle" fontSize="8.5" fontWeight="500" fill={C.text} style={{userSelect:"none"}}>{s.label.length>12?s.label.slice(0,11)+"…":s.label}</text>;})}
    </svg>
  );
}

function ResetPasswordScreen({recoveryToken,onDone}) {
  const [password,setPassword]=useState(""); const [confirm,setConfirm]=useState("");
  const [loading,setLoading]=useState(false); const [error,setError]=useState(""); const [success,setSuccess]=useState(false);

  const handleSubmit = async () => {
    setError("");
    if(password.length<6){setError("La contraseña debe tener al menos 6 caracteres");return;}
    if(password!==confirm){setError("Las contraseñas no coinciden");return;}
    setLoading(true);
    const res = await sb.updatePassword(recoveryToken,password);
    setLoading(false);
    if(res.ok){ setSuccess(true); }
    else { setError(res.error||"No se pudo actualizar la contraseña"); }
  };

  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px"}}>
      <div style={{width:"100%",maxWidth:360}}>

          <div style={{fontSize:22,fontWeight:800,color:C.text}}>Nueva contraseña</div>
          <div style={{fontSize:13,color:C.muted,marginTop:4}}>Elige tu nueva contraseña de acceso</div>
        </div>
        {success?(
          <>
            <div style={{background:C.accent+"18",border:`1px solid ${C.accent}44`,borderRadius:10,padding:"14px 12px",marginBottom:16,fontSize:13,color:C.accent,lineHeight:1.5}}>✅ Contraseña actualizada correctamente. Ya puedes iniciar sesión.</div>
            <button onClick={onDone} style={btnP}>Ir al login</button>
          </>
        ):(
          <>
            {error&&<div style={{background:C.danger+"22",border:`1px solid ${C.danger}44`,borderRadius:10,padding:"10px 12px",marginBottom:14,fontSize:12,color:C.danger}}>{error}</div>}
            <input placeholder="Nueva contraseña" value={password} onChange={e=>setPassword(e.target.value)} type="password" style={inp}/>
            <input placeholder="Confirmar contraseña" value={confirm} onChange={e=>setConfirm(e.target.value)} type="password" style={inp}/>
            <button onClick={handleSubmit} disabled={loading} style={{...btnP,opacity:loading?0.7:1}}>{loading?"Guardando...":"Guardar contraseña"}</button>
          </>
        )}
      </div>
    </div>
  );
}

function LoginScreen({onLogin,initialError}) {
  const [mode,setMode]=useState(initialError?"coach":"player");
  const [playerSubMode,setPlayerSubMode]=useState("activate");
  const [email,setEmail]=useState(""); const [password,setPassword]=useState("");
  const [padCode,setPadCode]=useState(""); const [padPin,setPadPin]=useState("");
  const [loading,setLoading]=useState(false); const [error,setError]=useState(initialError||"");
  const [connStatus,setConnStatus]=useState(null); const [testingConn,setTestingConn]=useState(false);
  const [forgotMode,setForgotMode]=useState(false); const [forgotEmail,setForgotEmail]=useState("");
  const [forgotLoading,setForgotLoading]=useState(false); const [forgotSent,setForgotSent]=useState(false); const [forgotError,setForgotError]=useState("");

  const handleForgotPassword = async () => {
    if(!forgotEmail.trim()){setForgotError("Ingresa tu email");return;}
    setForgotLoading(true);setForgotError("");
    const res = await sb.requestPasswordReset(forgotEmail.trim());
    setForgotLoading(false);
    if(res.ok){ setForgotSent(true); } else { setForgotError(res.error||"No se pudo enviar el correo"); }
  };

  const handleCoachLogin = async () => {
    if(!email||!password){setError("Ingresa email y contraseña");return;}
    setLoading(true);setError("");
    let res;
    try { res = await sb.signIn(email,password); } catch(e) { setError("❌ Error de red: "+e.message);setLoading(false);return; }
    const token = res.access_token||(res.session&&res.session.access_token);
    const userId = (res.user&&res.user.id)||(res.session&&res.session.user&&res.session.user.id);
    if(token&&userId){ localStorage.setItem("pc_token",token);localStorage.setItem("pc_user_id",userId);onLogin(token,userId); }
    else { setError(res._msg || res.error_description || res.message || "Error desconocido"); }
    setLoading(false);

  const handlePlayerActivate = async () => {
    if(!padCode.trim()||!padPin.trim()||!email.trim()||!password){setError("Completa código, PIN, email y contraseña");return;}
    if(password.length<6){setError("La contraseña debe tener al menos 6 caracteres");return;}

            <button onClick={handleCoachLogin} disabled={loading} style={{...btnP,opacity:loading?0.7:1}}>{loading?"Entrando...":"Entrar"}</button>
            <div style={{textAlign:"center",marginTop:10}}><button onClick={()=>{setForgotMode(true);setForgotEmail(email);setError("");}} style={{background:"none",border:"none",color:C.accent,fontSize:12,fontWeight:600,cursor:"pointer",padding:4}}>¿Olvidaste tu contraseña?</button></div>

// ── SESSION FORM ──────────────────────────────────────────────────────────────
function SessionForm({player,token,coachId,onBack,isFormal=false,thresholds}) {
  const [form,setForm]=useState({title:isFormal?"Evaluación formal":"",content:"",date:new Date().toISOString().slice(0,10)});
  const [scores,setScores]=useState(isFormal?fullSessionScores():emptySessionScores());
  const [catIdx,setCatIdx]=useState(0); const [step,setStep]=useState("info"); const [saving,setSaving]=useState(false);
  const scoredCount=Object.values(scores).filter(v=>v!==null).length;
  const save = async () => {
    if(!form.title.trim()) return; setSaving(true);
    await sb.post(token,"sessions",{player_id:player.id,club_id:CLUB_ID,recorded_by_coach_id:coachId,primary_coach_id:player.primary_coach_id,title:form.title.trim(),content:form.content.trim(),date:form.date,is_formal:isFormal,scores});
    setSaving(false); onBack(true);
  };
  if(step==="info") return(
    <div style={{padding:"16px 16px 90px"}}>
      <BackBtn label={player.name} onClick={onBack}/>
      <div style={{fontSize:18,fontWeight:800,color:C.text,marginBottom:4}}>{isFormal?"📊 Evaluación Formal":"📋 Nueva Sesión"}</div>
      <div style={{fontSize:12,color:C.muted,marginBottom:16}}>{isFormal?"Califica todos los skills":"Califica solo lo que entrenaron hoy, el resto en N/A"}</div>
      <input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} style={inp}/>
      <input placeholder={isFormal?"Evaluación formal":"Título (ej: Volea + bajada de pared)"} value={form.title} onChange={e=>setForm({...form,title:e.target.value})} style={inp}/>
      <textarea placeholder="Notas generales (opcional)..." value={form.content} onChange={e=>setForm({...form,content:e.target.value})} rows={3} style={{...inp,resize:"none"}}/>
      <button onClick={()=>{if(form.title.trim())setStep("skills");}} style={btnP}>Calificar skills →</button>
    </div>
  );
  const cat=SKILL_CATEGORIES[catIdx]; const isLast=catIdx===SKILL_CATEGORIES.length-1;
  return(
    <div>
      <div style={{background:C.surface,padding:"12px 16px",borderBottom:`1px solid ${C.border}`}}>
        <BackBtn label="Info" onClick={()=>setStep("info")}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <div style={{fontSize:13,fontWeight:700,color:C.text}}>{form.title}</div>
          <div style={{fontSize:11,color:C.accent,fontWeight:700}}>{catIdx+1}/{SKILL_CATEGORIES.length}</div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <span style={{fontSize:11,color:C.muted}}>{scoredCount} skills calificados</span>
          {isFormal&&<Badge label="Evaluación formal" color={C.accent}/>}
        </div>
        <div style={{height:4,borderRadius:2,background:C.border}}><div style={{height:"100%",width:`${((catIdx+1)/SKILL_CATEGORIES.length)*100}%`,borderRadius:2,background:isFormal?C.accent:C.blue,transition:"width 0.3s"}}/></div>
      </div>
      <div style={{padding:"16px 16px 100px"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:12}}><RadarChart scores={scores} size={200} catId={cat.id}/></div>
        <div style={{background:C.card,borderRadius:16,padding:16,border:`1px solid ${C.border}`,marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:cat.color,marginBottom:16,textTransform:"uppercase",letterSpacing:"0.06em"}}>{cat.label}</div>
          {cat.skills.map(skill=><ScoreInput key={skill.id} skill={skill} value={scores[skill.id]} onChange={(id,v)=>setScores(p=>({...p,[id]:v}))} thresholds={thresholds}/>)}
        </div>
        <div style={{display:"flex",gap:8}}>
          {catIdx>0&&<button onClick={()=>setCatIdx(i=>i-1)} style={{...btnS,flex:1}}>← Anterior</button>}
          {!isLast?<button onClick={()=>setCatIdx(i=>i+1)} style={{...btnP,flex:1}}>Siguiente →</button>
                  :<button onClick={save} disabled={saving} style={{...btnP,flex:1,background:C.success,opacity:saving?0.7:1}}>{saving?"Guardando...":"✅ Guardar"}</button>}
        </div>
      </div>
    </div>
  );
}

// ── LEVEL CARD ────────────────────────────────────────────────────────────────
function LevelCard({currentScores,thresholds}) {
  const calc=useMemo(()=>computeLevel(currentScores,thresholds),[currentScores,thresholds]);
  const lc=levelColor(calc.level); const nextLc=calc.nextLevel?levelColor(calc.nextLevel):null;
  return(
    <div style={{background:C.card,borderRadius:14,padding:16,border:`1px solid ${lc}44`,marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
        <div><div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:4}}>NIVEL CALCULADO</div><div style={{fontSize:22,fontWeight:800,color:lc}}>{calc.level}</div></div>
        {calc.nextLevel&&<div style={{textAlign:"right"}}><div style={{fontSize:10,color:C.muted,marginBottom:2}}>Hacia {calc.nextLevel}</div><div style={{fontSize:20,fontWeight:800,color:nextLc}}>{calc.pctToNext}%</div></div>}
      </div>
      {calc.nextLevel&&(<><div style={{height:6,borderRadius:3,background:C.border,marginBottom:12}}><div style={{height:"100%",width:`${calc.pctToNext}%`,borderRadius:3,background:`linear-gradient(90deg,${lc},${nextLc})`,transition:"width 0.5s"}}/></div>{calc.missing.length>0&&(<div><div style={{fontSize:10,color:C.muted,fontWeight:600,marginBottom:8}}>SKILLS POR MEJORAR</div>{calc.missing.slice(0,5).map(s=>(<div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontSize:12,color:C.text}}>{s.label}</span><div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:11,color:scColor(s.current),fontWeight:700}}>{s.current}</span><span style={{fontSize:10,color:C.muted}}>→</span><span style={{fontSize:11,color:nextLc,fontWeight:700}}>{s.needed}</span><span style={{fontSize:10,color:C.danger,fontWeight:700}}>(-{s.gap})</span></div></div>))}</div>)}</>)}
      {calc.level==="Avanzado"&&<div style={{fontSize:13,color:C.accent,fontWeight:700,textAlign:"center"}}>🏆 Nivel máximo alcanzado</div>}
    </div>
  );
}

// ── AI ANALYSIS TAB ───────────────────────────────────────────────────────────
function AIAnalysisTab({player, sessions, thresholds, token}) {
  const [analysis, setAnalysis] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const coachSessions = sessions.filter(s => s.source !== "player");
  const latestSession = coachSessions[0];
  const selfSessions = sessions.filter(s => s.source === "player");
  const trainingSelf = selfSessions.filter(s => (s.context||"training") !== "match");
  const matchSelf = selfSessions.filter(s => s.context === "match").sort((a,b)=>new Date(b.date)-new Date(a.date));
  const matchAssessCount = matchSelf.length;

  const loadAnalysis = useCallback(async (force=false) => {
    if (!latestSession) return;
    setLoading(true); setError("");
    try {
      const cached = await sb.get(token,"ai_recommendations",`?player_id=eq.${player.id}&session_id=eq.${latestSession.id}&limit=1`);
      if (!force && cached&&Array.isArray(cached)&&cached.length&&cached[0].recommendation) {
        try { setAnalysis(JSON.parse(cached[0].recommendation)); setLoading(false); return; } catch(e) {}
      }
      const currentScores = {};
      const ordered = [...coachSessions].sort((a,b)=>new Date(a.date)-new Date(b.date));
      for (const s of ordered) {
        if (!s.scores) continue;
        const sc = typeof s.scores==="string"?JSON.parse(s.scores):s.scores;
        for (const [id,val] of Object.entries(sc)) { if(val!==null) currentScores[id]=val; }
      }
      const formals = coachSessions.filter(s=>s.is_formal).sort((a,b)=>new Date(a.date)-new Date(b.date));
      const trendData = formals.slice(-3).map(s=>{
        const sc=typeof s.scores==="string"?JSON.parse(s.scores):s.scores||{};
        const vals=Object.values(sc).filter(v=>v!==null);
        const avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):"—";
        return {date:s.date,avg,title:s.title};
      });
      const currentFuerzaIdx = FUERZAS.indexOf(player.level||"5ta Fuerza");
      const nextFuerza = FUERZAS[currentFuerzaIdx+1];
      const nextKey = nextFuerza?FUERZA_KEYS[currentFuerzaIdx+1]:null;
      const gapSkills = nextKey?ALL_SKILLS.filter(s=>currentScores[s.id]!==undefined).map(s=>{
        const thresh=thresholds[s.id]?.[nextKey];
        if(!thresh||thresh==="NA") return null;
        const gap=Number(thresh)-(currentScores[s.id]||0);
        return gap>0?{label:s.label,current:currentScores[s.id],needed:Number(thresh),gap}:null;
      }).filter(Boolean).sort((a,b)=>a.gap-b.gap).slice(0,5):[];
      const goalContext = player.goal==="competitivo"?"Objetivo: Competitivo — torneos y ranking.":player.goal==="fitness"?"Objetivo: Fitness — condición física.":player.goal==="recreativo"?"Objetivo: Recreativo — mejorar gradualmente.":"Objetivo no definido.";

      // ── Presión de Juego: gap de skills (auto-eval entreno vs partido) + cuestionario ──
      const parseSc = s => typeof s.scores==="string"?JSON.parse(s.scores):(s.scores||{});
      const skillGaps = [];
      if (matchAssessCount>0) {
        for (const sk of ALL_SKILLS) {
          const trainVals = trainingSelf.map(s=>parseSc(s)[sk.id]).filter(v=>v!==null&&v!==undefined);
          const matchVals = matchSelf.map(s=>parseSc(s)[sk.id]).filter(v=>v!==null&&v!==undefined);
          if (trainVals.length && matchVals.length) {
            const trainAvg = trainVals.reduce((a,b)=>a+b,0)/trainVals.length;
            const matchAvg = matchVals.reduce((a,b)=>a+b,0)/matchVals.length;
            const drop = trainAvg-matchAvg;
            if (Math.abs(drop)>=0.5) skillGaps.push({label:sk.label,train:trainAvg.toFixed(1),match:matchAvg.toFixed(1),drop:drop.toFixed(1)});
          }
        }
        skillGaps.sort((a,b)=>b.drop-a.drop);
      }
      const pressureAvgFor = (list,qid) => { const vals=list.map(s=>(s.pressure_ratings||{})[qid]).filter(v=>v!==null&&v!==undefined); return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length):null; };
      const pressureRows = matchAssessCount>0 ? PRESSURE_QUESTIONS.map(q=>({label:q.label,match:pressureAvgFor(matchSelf,q.id),training:pressureAvgFor(trainingSelf,q.id)})).filter(r=>r.match!==null) : [];
      const matchHistory = matchSelf.slice(0,5).map(m=>`${m.date} · ${MATCH_TYPE_LABELS[m.match_type]||m.match_type||"partido"} · ${MATCH_RESULT_LABELS[m.match_result]||m.match_result||"—"}${m.match_score?` · ${m.match_score}`:""}`);
      const certainty = matchAssessCount===0?"sin_datos":matchAssessCount===1?"puntual (usa lenguaje de observación de un solo caso, evita 'patrón'/'tendencia'/'consistente')":matchAssessCount<=3?"emergente (usa 'empieza a verse'/'en tus últimos partidos', sin afirmar un patrón consolidado)":"consolidado (ya puedes hablar de patrón con más confianza)";
      const presionSection = matchAssessCount===0
        ? "No hay autoevaluaciones de partido registradas todavía. Responde el campo \"presion\" como null."
        : `AUTOEVALUACIONES DE PARTIDO REGISTRADAS: ${matchAssessCount}
NIVEL DE CERTEZA A USAR: ${certainty}

HISTORIAL DE PARTIDOS RECIENTES:
${matchHistory.join("\n")}

GAP DE SKILLS (auto-evaluación en entrenamiento vs en partido, solo skills con datos en ambos contextos, gap>=0.5):
${skillGaps.length?skillGaps.map(s=>`${s.label}: entreno ${s.train} vs partido ${s.match} (caída de ${s.drop})`).join("\n"):"Sin skills con caída relevante entre entreno y partido todavía."}

CUESTIONARIO "PRESIÓN DE JUEGO" (escala 1-4, mayor=más intenso; en 'lectura' y 'confianza_tecnica' mayor es mejor, en el resto mayor es peor):
${pressureRows.length?pressureRows.map(r=>`${r.label}: partido ${r.match.toFixed(1)}${r.training!==null?` vs entreno ${r.training.toFixed(1)}`:""}`).join("\n"):"Sin datos del cuestionario todavía."}

No inventes números que no te di. Conecta el gap de skills con las respuestas del cuestionario para explicarle al coach (no psicólogo) qué podría estar pasando bajo presión de competencia, y dale 1-2 acciones concretas de entrenamiento.`;

      const prompt = `Eres un analista de pádel experto. Analiza los datos y genera un análisis técnico en JSON.

JUGADOR: ${player.name}
CATEGORÍA: ${player.level||"5ta Fuerza"} ${player.gender||""}
${goalContext}
SIGUIENTE CATEGORÍA: ${nextFuerza||"Ya en Open"}

SCORES ACTUALES: ${Object.entries(currentScores).map(([id,v])=>`${id}:${v}`).join(", ")}

PROGRESIÓN (últimas evals formales):
${trendData.map(t=>`${t.date}: prom ${t.avg} — ${t.title}`).join("\n")}

SESIONES TOTAL: ${coachSessions.length} (${formals.length} formales)

BRECHA A ${nextFuerza||"Open"}:
${gapSkills.map(s=>`${s.label}: actual ${s.current} → necesita ${s.needed} (gap ${s.gap})`).join("\n")}

${presionSection}

Responde SOLO con este JSON (sin markdown):
{"resumen":"2-3 frases análisis técnico directo","tendencia":"descripción tendencia de progresión","prioridades":[{"skill":"nombre","actual":0,"meta":0,"accion":"acción concreta"},{"skill":"nombre","actual":0,"meta":0,"accion":"acción concreta"},{"skill":"nombre","actual":0,"meta":0,"accion":"acción concreta"}],"proyeccion":"estimación sesiones para siguiente categoría","presion":${matchAssessCount===0?"null":'{"diagnostico":"2-4 frases conectando el gap de skills con el cuestionario, en lenguaje de coach, calibrado al nivel de certeza indicado","sugerencia":"1-2 acciones concretas de entrenamiento para cerrar la brecha entreno-partido"}'}}`;

      const result = await callClaudeAPI(prompt);
      setAnalysis(result);
      if (cached&&Array.isArray(cached)&&cached.length) {
        await sb.patch(token,"ai_recommendations",cached[0].id,{recommendation:JSON.stringify(result)});
      } else {
        await sb.post(token,"ai_recommendations",{player_id:player.id,session_id:latestSession.id,recommendation:JSON.stringify(result)});
      }
    } catch(e) { setError("Error generando análisis: "+e.message); }
    setLoading(false);
  },[player.id,latestSession?.id,sessions]);

  useEffect(()=>{ loadAnalysis(); },[loadAnalysis]);

  if(!latestSession) return(<div style={{textAlign:"center",padding:60,color:C.muted}}><div style={{fontSize:40,marginBottom:12}}>🤖</div><div style={{fontSize:14,fontWeight:600}}>Sin sesiones para analizar</div><div style={{fontSize:12,marginTop:8}}>Registra al menos una sesión para activar el análisis IA</div></div>);
  if(loading) return(<div style={{textAlign:"center",padding:60}}><div style={{fontSize:36,marginBottom:16}}>🤖</div><Spinner/><div style={{fontSize:12,color:C.muted,marginTop:12}}>Analizando datos del jugador...</div></div>);
  if(error) return(<div style={{background:C.danger+"22",borderRadius:12,padding:16,border:`1px solid ${C.danger}44`}}><div style={{fontSize:13,color:C.danger,marginBottom:8}}>{error}</div><button onClick={()=>{setAnalysis(null);loadAnalysis(true);}} style={{...btnS,fontSize:12}}>Reintentar</button></div>);
  if(!analysis) return null;

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em"}}>🤖 Análisis IA</div>
        <button onClick={()=>{setAnalysis(null);loadAnalysis(true);}} style={{background:C.border,border:"none",color:C.muted,borderRadius:8,padding:"4px 10px",fontSize:10,fontWeight:700,cursor:"pointer"}}>↺ Actualizar</button>
      </div>
      <div style={{background:C.card,borderRadius:14,padding:16,border:`1px solid ${C.accent}33`,marginBottom:14}}>
        <div style={{fontSize:10,color:C.accent,fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>Estado actual</div>
        <div style={{fontSize:13,color:C.text,lineHeight:1.7}}>{analysis.resumen}</div>
      </div>
      <div style={{background:C.card,borderRadius:14,padding:16,border:`1px solid ${C.blue}33`,marginBottom:14}}>
        <div style={{fontSize:10,color:C.blue,fontWeight:700,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>📈 Tendencia</div>
        <div style={{fontSize:13,color:C.text,lineHeight:1.7}}>{analysis.tendencia}</div>
      </div>
      {analysis.prioridades&&analysis.prioridades.length>0&&(
        <div style={{marginBottom:14}}>
          <div style={{fontSize:10,color:C.warning,fontWeight:700,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.06em"}}>🎯 Prioridades de entrenamiento</div>
          {analysis.prioridades.map((p,i)=>(
            <div key={i} style={{background:C.card,borderRadius:12,padding:14,border:`1px solid ${C.border}`,marginBottom:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:13,fontWeight:700,color:C.text}}>{p.skill}</span>
                <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:13,fontWeight:800,color:scColor(p.actual)}}>{p.actual}</span><span style={{fontSize:10,color:C.muted}}>→</span><span style={{fontSize:13,fontWeight:800,color:C.accent}}>{p.meta}</span></div>
              </div>
              <div style={{fontSize:11,color:C.muted,lineHeight:1.5}}>{p.accion}</div>
            </div>
          ))}
        </div>
      )}
      <div style={{background:C.purple+"11",borderRadius:14,padding:16,border:`1px solid ${C.purple}44`,marginBottom:14}}>

// ── COMPARE SESSIONS ─────────────────────────────────────────────────────────
function CompareSessions({sessions, onBack, thresholds}) {
  const [selA, setSelA] = useState(null);
  const [selB, setSelB] = useState(null);

  const evalPool = useMemo(() => {
    const coachSess = sessions
      .filter(s => s.source !== "player" && s.scores && Object.values(
        typeof s.scores === "string" ? JSON.parse(s.scores) : s.scores
      ).some(v => v !== null))
      .map(s => ({...s, _source:"Coach", _scores:typeof s.scores==="string"?JSON.parse(s.scores):s.scores}));
    const selfSess = sessions
      .filter(s => s.source === "player" && s.scores && Object.values(
        typeof s.scores === "string" ? JSON.parse(s.scores) : s.scores
      ).some(v => v !== null))
      .map(s => ({...s, _source:"Alumno", _scores:typeof s.scores==="string"?JSON.parse(s.scores):s.scores}));
    return [...coachSess, ...selfSess].sort((a,b) => new Date(b.date)-new Date(a.date));
  }, [sessions]);

  const handleSelect = (ev) => {
    const isA = selA && selA.id===ev.id && selA._source===ev._source;
    const isB = selB && selB.id===ev.id && selB._source===ev._source;
    if (isA) { setSelA(null); return; }
    if (isB) { setSelB(null); return; }
    if (!selA) { setSelA(ev); return; }
    if (!selB) { setSelB(ev); return; }
  };

  return (
    <div style={{minHeight:"100vh",background:C.bg}}>
      <div style={{background:C.surface,padding:"16px 16px 12px",borderBottom:`1px solid ${C.border}`}}>
        <BackBtn label="Alumno" onClick={onBack}/>
        <div style={{fontSize:18,fontWeight:800,color:C.text,marginBottom:4}}>⚖️ Comparar Evaluaciones</div>
        <div style={{fontSize:12,color:C.muted}}>Selecciona dos evaluaciones para comparar</div>
      </div>
      <div style={{padding:"16px 16px 90px"}}>
        {evalPool.length < 2 ? (
          <div style={{textAlign:"center",padding:60,color:C.muted}}>
            <div style={{fontSize:40,marginBottom:12}}>⚖️</div>
            <div style={{fontSize:14,fontWeight:600}}>Necesitas al menos 2 evaluaciones</div>
            <div style={{fontSize:12,marginTop:8}}>Registra más sesiones con scores para usar esta función</div>
          </div>
        ) : (
          <>
            <div style={{display:"flex",gap:8,marginBottom:16}}>
              <div style={{flex:1,background:selA?C.accent+"22":C.card,borderRadius:10,padding:"8px 10px",border:`1px solid ${selA?C.accent:C.border}`}}>
                <div style={{fontSize:9,color:selA?C.accent:C.muted,fontWeight:700,marginBottom:2}}>LADO A</div>
                <div style={{fontSize:11,color:C.text,fontWeight:600}}>{selA?`${selA._source} · ${fmtShort(selA.date)}`:"Sin seleccionar"}</div>
                {selA&&<div style={{fontSize:10,color:C.muted,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{selA.title}</div>}
              </div>
              <div style={{flex:1,background:selB?C.blue+"22":C.card,borderRadius:10,padding:"8px 10px",border:`1px solid ${selB?C.blue:C.border}`}}>
                <div style={{fontSize:9,color:selB?C.blue:C.muted,fontWeight:700,marginBottom:2}}>LADO B</div>
                <div style={{fontSize:11,color:C.text,fontWeight:600}}>{selB?`${selB._source} · ${fmtShort(selB.date)}`:"Sin seleccionar"}</div>
                {selB&&<div style={{fontSize:10,color:C.muted,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{selB.title}</div>}
              </div>
            </div>
            {selA&&selB&&(
              <div style={{marginBottom:20}}>
                <div style={{display:"flex",justifyContent:"center",marginBottom:8}}>
                  <RadarChart scores={selA._scores} compareScores={selB._scores} size={280}/>
                </div>
                <div style={{display:"flex",gap:16,justifyContent:"center",marginBottom:16}}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{width:20,height:2,background:C.accent,borderRadius:1}}/>
                    <span style={{fontSize:11,color:C.muted}}>{selA._source} · {fmtShort(selA.date)}</span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{width:20,height:2,background:C.blue,borderRadius:1}}/>
                    <span style={{fontSize:11,color:C.muted}}>{selB._source} · {fmtShort(selB.date)}</span>
                  </div>
                </div>
                {SKILL_CATEGORIES.map(cat=>{
                  const catSkills=cat.skills.filter(s=>(selA._scores[s.id]!==null&&selA._scores[s.id]!==undefined)||(selB._scores[s.id]!==null&&selB._scores[s.id]!==undefined));
                  if(!catSkills.length) return null;
                  return(
                    <div key={cat.id} style={{marginBottom:16}}>
                      <div style={{fontSize:11,fontWeight:700,color:cat.color,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>{cat.label}</div>
                      {catSkills.map(s=>{
                        const vA=selA._scores[s.id]??null,vB=selB._scores[s.id]??null;
                        const diff=vA!==null&&vB!==null?vA-vB:null;
                        return(
                          <div key={s.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,background:C.card,borderRadius:10,padding:"8px 12px"}}>
                            <span style={{flex:1,fontSize:12,color:C.text}}>{s.label}</span>
                            <span style={{fontSize:14,fontWeight:800,color:vA!==null?scColor(vA):C.muted,minWidth:24,textAlign:"center"}}>{vA!==null?vA:"—"}</span>
                            <span style={{fontSize:10,color:C.muted}}>vs</span>
                            <span style={{fontSize:14,fontWeight:800,color:vB!==null?scColor(vB):C.muted,minWidth:24,textAlign:"center"}}>{vB!==null?vB:"—"}</span>
                            {diff!==null&&<span style={{fontSize:11,fontWeight:700,color:diff>0?C.success:diff<0?C.danger:C.muted,minWidth:28,textAlign:"right"}}>{diff>0?`+${diff}`:diff}</span>}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
                <button onClick={()=>{setSelA(null);setSelB(null);}} style={{...btnS,marginTop:8}}>↩ Cambiar selección</button>
              </div>
            )}
            <div style={{fontSize:11,color:C.muted,fontWeight:700,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.06em"}}>
              {selA&&selB?"Cambia selección":!selA?"Elige Lado A":"Elige Lado B"}
            </div>
            {evalPool.map(ev=>{
              const isA=selA&&selA.id===ev.id&&selA._source===ev._source;
              const isB=selB&&selB.id===ev.id&&selB._source===ev._source;
              const avg=avgScored(ev._scores||{});
              const isCoach=ev._source==="Coach";
              return(
                <div key={ev.id+ev._source} onClick={()=>handleSelect(ev)}
                  style={{background:isA?C.accent+"22":isB?C.blue+"22":C.card,borderRadius:12,padding:12,border:`1px solid ${isA?C.accent:isB?C.blue:C.border}`,marginBottom:8,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",opacity:(selA&&selB&&!isA&&!isB)?0.45:1}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:C.text}}>{ev.title}</div>
                    <div style={{display:"flex",gap:6,marginTop:3}}>
                      <span style={{fontSize:11,color:C.muted}}>{fmtDate(ev.date)}</span>
                      <Badge label={ev._source} color={isCoach?C.blue:C.accent}/>
                      {ev.is_formal&&<Badge label="Formal" color={C.warning}/>}
                    </div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    {avg&&<span style={{fontSize:16,fontWeight:800,color:isCoach?C.blue:C.accent}}>{avg}</span>}
                    {isA&&<Badge label="A" color={C.accent}/>}
                    {isB&&<Badge label="B" color={C.blue}/>}
                  </div>
                </div>
              );
            })}
          </>
        )}
      </div>
    </div>
  );
}

// ── SESSION FILTERS (shared by coach & alumno session lists) ──────────────────
function applySessionFilters(list, {search, typeFilter, filterSkills, dateFrom, dateTo}) {
  let out = list;
  if (typeFilter === "formal") out = out.filter(s => s.is_formal && s.source !== "player");
  else if (typeFilter === "informal") out = out.filter(s => !s.is_formal && s.source !== "player");
  else if (typeFilter === "self") out = out.filter(s => s.source === "player");
  if (filterSkills.length) out = out.filter(s => { const sc = (typeof s.scores === "string" ? JSON.parse(s.scores) : s.scores) || {}; return filterSkills.some(id => sc[id] !== null && sc[id] !== undefined); });
  if (dateFrom) out = out.filter(s => s.date >= dateFrom);
  if (dateTo) out = out.filter(s => s.date <= dateTo);
  if (search.trim()) { const q = search.toLowerCase(); out = out.filter(s => s.title.toLowerCase().includes(q) || (s.content||"").toLowerCase().includes(q) || (s.date||"").includes(q)); }
  return out;
}

// ── TRIANGLE VIEW ─────────────────────────────────────────────────────────────
function TriangleView({session,allSessions,player,coaches,onBack,thresholds,token,canEdit,onDeleted}) {
  const [activeSource,setActiveSource]=useState("coach");
  const [confirmDel,setConfirmDel]=useState(false); const [deleting,setDeleting]=useState(false);
  // Encontrar self-assessment del alumno: primero después de esta sesión, antes de la siguiente
  const coachSessions=[...allSessions].filter(s=>s.source!=="player").sort((a,b)=>new Date(a.date)-new Date(b.date));
  const sessionIdx=coachSessions.findIndex(s=>s.id===session.id);
  const nextSession=coachSessions[sessionIdx+1];
  const selfAssessments=allSessions.filter(s=>s.source==="player").sort((a,b)=>new Date(a.date)-new Date(b.date));
  const pairedSelf=selfAssessments.find(s=>{const d=new Date(s.date);return d>new Date(session.date)&&(!nextSession||d<=new Date(nextSession.date));});
  const coachScores=session.scores||{};
  const selfScores=pairedSelf?.scores||{};
  const coachAvg=avgScored(coachScores);
  const selfAvg=pairedSelf?avgScored(selfScores):null;
  const recordedBy=coaches.find(c=>c.id===session.recorded_by_coach_id);
  const deletableId=activeSource==="coach"?session.id:pairedSelf?.id;
  const doDelete=async()=>{if(!deletableId)return;setDeleting(true);await sb.delete(token,"sessions",deletableId);setDeleting(false);setConfirmDel(false);onDeleted&&onDeleted();};
  const sources=[
    {id:"coach",icon:"🏅",label:"Coach",avg:coachAvg,scores:coachScores,color:C.accent,available:true},
    {id:"player",icon:"🎾",label:"Alumno",avg:selfAvg,scores:selfScores,color:C.blue,available:!!pairedSelf},
    {id:"ia",icon:"🤖",label:"IA",avg:null,scores:null,color:C.purple,available:false},
  ];
  return(
    <div style={{minHeight:"100vh",background:C.bg}}>
      {confirmDel&&<ConfirmDialog title={activeSource==="coach"?"¿Eliminar esta evaluación?":"¿Eliminar esta auto-evaluación?"} message="Se eliminará permanentemente y no podrá deshacerse." confirmLabel="Eliminar" onConfirm={doDelete} onCancel={()=>setConfirmDel(false)}/>}
      <div style={{background:C.surface,padding:"16px 16px 12px",borderBottom:`1px solid ${C.border}`}}>
        <BackBtn label="Sesiones" onClick={onBack}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{fontSize:16,fontWeight:800,color:C.text,marginBottom:2}}>{session.title}</div>
          {canEdit&&deletableId&&<button onClick={()=>setConfirmDel(true)} disabled={deleting} style={btnD}>🗑</button>}
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:12}}>
          <span style={{fontSize:12,color:C.muted}}>{fmtDate(session.date)}</span>
          {session.is_formal&&<Badge label="Eval. formal" color={C.accent}/>}
          {recordedBy&&<Badge label={`Coach: ${recordedBy.name}`} color={C.muted}/>}
        </div>
        {/* Selector triángulo */}
        <div style={{display:"flex",gap:6}}>
          {sources.map(src=>(<button key={src.id} onClick={()=>src.available&&setActiveSource(src.id)} style={{flex:1,padding:"10px 4px",borderRadius:12,border:`2px solid ${activeSource===src.id?src.color:C.border}`,background:activeSource===src.id?src.color+"22":C.card,cursor:src.available?"pointer":"default",opacity:src.available?1:0.45,transition:"all 0.15s"}}><div style={{fontSize:18,marginBottom:2}}>{src.icon}</div><div style={{fontSize:10,fontWeight:700,color:activeSource===src.id?src.color:C.muted}}>{src.label}</div>{src.available&&src.avg&&<div style={{fontSize:14,fontWeight:800,color:src.color}}>{src.avg}</div>}{src.available&&!src.avg&&<div style={{fontSize:9,color:C.muted}}>sin datos</div>}{!src.available&&src.id==="player"&&<div style={{fontSize:9,color:C.muted}}>Sin auto-eval</div>}{!src.available&&src.id==="ia"&&<div style={{fontSize:9,color:C.muted}}>Próximamente</div>}</button>))}
        </div>
      </div>
      <div style={{padding:"16px 16px 90px"}}>
        {activeSource==="coach"&&(<div>
          <div style={{display:"flex",justifyContent:"center",marginBottom:16}}><RadarChart scores={coachScores} size={260}/></div>

          {SKILL_CATEGORIES.map(cat=>{const catSkills=cat.skills.filter(s=>coachScores[s.id]!==null&&coachScores[s.id]!==undefined);if(!catSkills.length) return null;return(<div key={cat.id} style={{marginBottom:20}}><div style={{fontSize:11,fontWeight:700,color:cat.color,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.06em"}}>{cat.label}</div>{catSkills.map(skill=><ScoreDisplay key={skill.id} skill={skill} value={coachScores[skill.id]} thresholds={thresholds}/>)}</div>);})}
        </div>)}

          <div style={{display:"flex",justifyContent:"center",marginBottom:16}}><RadarChart scores={selfScores} size={260}/></div>
          {SKILL_CATEGORIES.map(cat=>{const catSkills=cat.skills.filter(s=>selfScores[s.id]!==null&&selfScores[s.id]!==undefined);if(!catSkills.length) return null;return(<div key={cat.id} style={{marginBottom:20}}><div style={{fontSize:11,fontWeight:700,color:cat.color,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.06em"}}>{cat.label}</div>{catSkills.map(skill=>{const diff=selfScores[skill.id]!=null&&coachScores[skill.id]!=null?selfScores[skill.id]-coachScores[skill.id]:null;return(<div key={skill.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${C.border}22`}}><span style={{fontSize:12,color:C.text}}>{skill.label}</span><div style={{display:"flex",alignItems:"center",gap:8}}>{diff!=null&&<span style={{fontSize:10,fontWeight:700,color:diff>0?C.success:diff<0?C.danger:C.muted}}>{diff>0?"+":""}{diff}</span>}<ScoreDisplay skill={skill} value={selfScores[skill.id]} thresholds={thresholds}/></div></div>);})}</div>);})}
        </div>)}
      </div>
    </div>
  );
}

// ── PLAYER DETAIL ─────────────────────────────────────────────────────────────

  },[player.id,token]);
  useEffect(()=>{loadData();},[loadData]);
  const currentScores=useMemo(()=>computeCurrentScores(sessions),[sessions]);
  const addNote=async(shared=false)=>{if(!note.trim())return;await sb.post(token,"player_notes",{player_id:player.id,coach_id:coachId,text:note.trim(),source:"coach",shared});setNote("");loadData();showToast(shared?"Nota compartida":"Nota privada guardada");};
  const deleteNote=async(id)=>{await sb.delete(token,"player_notes",id);loadData();setConfirm(null);showToast("Nota eliminada");};

          {s.content&&<div style={{background:C.card,borderRadius:12,padding:12,border:`1px solid ${C.border}`,marginBottom:16}}><div style={{fontSize:11,color:C.muted,marginBottom:4,fontWeight:600}}>NOTAS DEL ALUMNO</div><div style={{fontSize:13,color:C.text,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{s.content}</div></div>}
        </div>
      </div>
    );
  }

  if(view==="sessionDetail"&&selectedSession){
    const sc=selectedSession.scores||{}; const avg=avgScored(sc); const recordedBy=coaches.find(c=>c.id===selectedSession.recorded_by_coach_id);
    return(
      <div style={{minHeight:"100vh",background:C.bg}}>
        {confirm&&<ConfirmDialog {...confirm} onCancel={()=>setConfirm(null)}/>}
        <div style={{background:C.surface,padding:"16px 16px 12px",borderBottom:`1px solid ${C.border}`}}>
          <BackBtn label="Sesiones" onClick={()=>setView("profile")}/>

            <div>
              <div style={{fontSize:16,fontWeight:800,color:C.text,marginBottom:4}}>{selectedSession.title}</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}><span style={{fontSize:12,color:C.muted}}>{fmtDate(selectedSession.date)}</span>{selectedSession.is_formal&&<Badge label="Eval. formal" color={C.accent}/>}{avg&&<Badge label={`Prom. ${avg}`} color={C.blue}/>}</div>

                {editingNote&&<NoteEditModal note={editingNote} onCancel={()=>setEditingNote(null)} onSave={async(text)=>{await sb.patch(token,"player_notes",editingNote.id,{text});setEditingNote(null);loadData();showToast("Nota actualizada");}}/>}

                {notes.filter(n=>n.source==="coach"&&!n.shared).map(n=>{const author=coaches.find(c=>c.id===n.coach_id);const isOwn=n.coach_id===coachId;const canEditNote=isOwn||coachRole==="admin";return(<div key={n.id} style={{background:C.card,borderRadius:12,padding:12,border:`1px solid ${C.border}`,marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",gap:8}}><div style={{fontSize:13,color:C.text,lineHeight:1.5,flex:1}}>{n.text}</div><div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}><button onClick={async()=>{await sb.patch(token,"player_notes",n.id,{shared:true});loadData();showToast("Nota compartida con alumno");}} style={{background:C.blue+"22",color:C.blue,border:`1px solid ${C.blue}44`,borderRadius:6,padding:"4px 8px",fontSize:10,fontWeight:700,cursor:"pointer"}}>📤</button>{canEditNote&&<button onClick={()=>setEditingNote(n)} style={{background:C.warning+"22",color:C.warning,border:`1px solid ${C.warning}44`,borderRadius:6,padding:"4px 8px",fontSize:10,fontWeight:700,cursor:"pointer"}}>✏️</button>}{canEditNote&&<button onClick={()=>setConfirm({title:"¿Eliminar nota?",message:"Se eliminará permanentemente.",onConfirm:()=>deleteNote(n.id)})} style={{...btnD,padding:"4px 8px"}}>🗑</button>}</div></div><div style={{fontSize:10,color:C.muted,marginTop:6}}>{fmtDate(n.created_at)}{author?` · ${author.name}`:""}</div></div>);})}
                <div style={{fontSize:11,fontWeight:700,color:C.blue,marginTop:16,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>📤 Notas compartidas con el alumno</div>
                {notes.filter(n=>n.source==="coach"&&n.shared).length===0&&<div style={{textAlign:"center",padding:"12px 0 20px",color:C.muted,fontSize:12}}>Sin notas compartidas aún</div>}
                {notes.filter(n=>n.source==="coach"&&n.shared).map(n=>{const author=coaches.find(c=>c.id===n.coach_id);const isOwn=n.coach_id===coachId;const canEditNote=isOwn||coachRole==="admin";return(<div key={n.id} style={{background:C.blue+"11",borderRadius:12,padding:12,border:`1px solid ${C.blue}44`,marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",gap:8}}><div style={{fontSize:13,color:C.text,lineHeight:1.5,flex:1}}>{n.text}</div><div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}><button onClick={async()=>{await sb.patch(token,"player_notes",n.id,{shared:false});loadData();showToast("Nota movida a privadas");}} style={{background:C.muted+"22",color:C.muted,border:`1px solid ${C.border}`,borderRadius:6,padding:"4px 8px",fontSize:10,fontWeight:700,cursor:"pointer"}}>🔒</button>{canEditNote&&<button onClick={()=>setEditingNote(n)} style={{background:C.warning+"22",color:C.warning,border:`1px solid ${C.warning}44`,borderRadius:6,padding:"4px 8px",fontSize:10,fontWeight:700,cursor:"pointer"}}>✏️</button>}{canEditNote&&<button onClick={()=>setConfirm({title:"¿Eliminar nota?",message:"Se eliminará permanentemente.",onConfirm:()=>deleteNote(n.id)})} style={{...btnD,padding:"4px 8px"}}>🗑</button>}</div></div><div style={{fontSize:10,color:C.muted,marginTop:6}}>{fmtDate(n.created_at)}{author?` · ${author.name}`:""}</div></div>);})}
                <div style={{fontSize:11,fontWeight:700,color:C.accent,marginTop:20,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>🎾 Notas del alumno</div>
                {notes.filter(n=>n.source==="player").length===0&&<div style={{textAlign:"center",padding:"12px 0 20px",color:C.muted,fontSize:12}}>El alumno no ha escrito notas aún</div>}
                {notes.filter(n=>n.source==="player").map(n=>(<div key={n.id} style={{background:C.accent+"11",borderRadius:12,padding:12,border:`1px solid ${C.accent}33`,marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",gap:8}}><div style={{fontSize:13,color:C.text,lineHeight:1.5,flex:1}}>{n.text}</div><div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>{coachRole==="admin"&&<button onClick={()=>setEditingNote(n)} style={{background:C.warning+"22",color:C.warning,border:`1px solid ${C.warning}44`,borderRadius:6,padding:"4px 8px",fontSize:10,fontWeight:700,cursor:"pointer"}}>✏️</button>}<button onClick={()=>setConfirm({title:"¿Eliminar nota del alumno?",message:"Se eliminará permanentemente.",onConfirm:()=>deleteNote(n.id)})} style={{...btnD,padding:"4px 8px"}}>🗑</button></div></div><div style={{fontSize:10,color:C.muted,marginTop:6}}>{fmtDate(n.created_at)}</div></div>))}
              </div>
            )}
            {activeTab==="cfg"&&canEdit&&(
              <div>
                <div style={{background:C.card,borderRadius:14,padding:16,border:`1px solid ${C.border}`,marginBottom:14}}>
                  <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:12}}>Editar alumno</div>
                  <input placeholder="Nombre completo *" value={editForm.name} onChange={e=>setEditForm({...editForm,name:e.target.value})} style={inp}/>
                  <input placeholder="Celular (opcional)" value={editForm.phone} onChange={e=>setEditForm({...editForm,phone:e.target.value})} type="tel" style={inp}/>
                  <input placeholder="Email (opcional)" value={editForm.email} onChange={e=>setEditForm({...editForm,email:e.target.value})} type="email" style={inp}/>
                  <div style={{marginBottom:10}}><div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:600}}>CATEGORÍA</div><select value={editForm.fuerza} onChange={e=>setEditForm({...editForm,fuerza:e.target.value})} style={inp}>{FUERZAS.map(f=><option key={f}>{f}</option>)}</select></div>
                  <div style={{marginBottom:10}}><div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:600}}>GÉNERO</div><div style={{display:"flex",gap:8,marginBottom:10}}>{GENEROS.map(g=>(<button key={g} onClick={()=>setEditForm({...editForm,gender:g})} style={{flex:1,padding:"9px",borderRadius:10,border:`1px solid ${editForm.gender===g?C.accent:C.border}`,background:editForm.gender===g?C.accent+"22":C.bg,color:editForm.gender===g?C.accent:C.muted,fontWeight:700,fontSize:13,cursor:"pointer"}}>{g}</button>))}</div></div>
                  <div style={{marginBottom:10}}><div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:600}}>FECHA DE NACIMIENTO</div><input type="date" value={editForm.birthdate} onChange={e=>setEditForm({...editForm,birthdate:e.target.value})} style={inp}/></div>
                  <textarea placeholder="Notas iniciales (opcional)" value={editForm.notes} onChange={e=>setEditForm({...editForm,notes:e.target.value})} rows={2} style={{...inp,resize:"none"}}/>
                  <button onClick={saveEdit} disabled={editSaving} style={{...btnP,background:editSaved?C.success:C.accent,opacity:editSaving?0.7:1}}>{editSaving?"Guardando...":editSaved?"✅ Guardado":"Guardar cambios"}</button>
                </div>
                {player.invite_code&&(<div style={{background:C.card,borderRadius:14,padding:16,border:`1px solid ${C.border}`,marginBottom:14}}><div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:4}}>Acceso del alumno</div><div style={{fontSize:11,color:C.muted,marginBottom:12,lineHeight:1.5}}>Comparte por WhatsApp.</div><div style={{background:C.bg,borderRadius:10,padding:"12px 16px",border:`1px solid ${C.accent}44`}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><span style={{fontSize:11,color:C.muted}}>Código</span><span style={{fontSize:22,fontWeight:800,color:C.accent,letterSpacing:"0.1em"}}>{player.invite_code}</span></div>{player.invite_pin&&(<div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:11,color:C.muted}}>PIN temporal</span><span style={{fontSize:22,fontWeight:800,color:C.blue,letterSpacing:"0.1em"}}>{player.invite_pin}</span></div>)}</div></div>)}
                <div style={{background:C.card,borderRadius:14,padding:16,border:`1px solid ${C.border}`,marginBottom:14}}><div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:4}}>Estado del alumno</div><div style={{fontSize:12,color:C.muted,marginBottom:14,lineHeight:1.5}}>Los alumnos inactivos se ocultan. Datos conservados <strong style={{color:C.warning}}>6 meses</strong>.</div><button onClick={()=>isInactive?setConfirm({title:"¿Reactivar alumno?",message:`${player.name} volverá a la lista activa.`,confirmLabel:"Reactivar",danger:false,onConfirm:toggleActive}):setConfirm({title:"¿Marcar como inactivo?",message:`${player.name} se ocultará.`,confirmLabel:"Marcar inactivo",danger:false,onConfirm:toggleActive})} style={{...btnS,color:isInactive?C.success:C.text,background:isInactive?C.success+"22":C.border}}>{isInactive?"✅ Reactivar alumno":"⏸ Marcar como inactivo"}</button></div>
                <div style={{background:C.danger+"11",borderRadius:14,padding:16,border:`1px solid ${C.danger}33`}}><div style={{fontSize:13,fontWeight:700,color:C.danger,marginBottom:4}}>Zona de peligro</div><div style={{fontSize:12,color:C.muted,marginBottom:14,lineHeight:1.5}}>Elimina el perfil con <strong style={{color:C.danger}}>{sessions.length} sesiones</strong> y todas las notas.</div><button onClick={()=>setConfirm({title:`¿Eliminar a ${player.name}?`,message:`${sessions.length} sesiones y todas las notas. Irreversible.`,confirmLabel:"Eliminar alumno",onConfirm:deletePlayer})} style={{...btnS,background:C.danger+"22",color:C.danger,border:`1px solid ${C.danger}44`}}>🗑 Eliminar alumno y todos sus datos</button></div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// ── PLAYERS TAB ───────────────────────────────────────────────────────────────
function PlayersTab({token,coachId,coachRole,thresholds,onSelectPlayer}) {
  const [players,setPlayers]=useState([]); const [loading,setLoading]=useState(true);
  const [showAdd,setShowAdd]=useState(false); const [search,setSearch]=useState("");
  const [filterLevel,setFilterLevel]=useState("Todos"); const [showInactive,setShowInactive]=useState(false);
  const [form,setForm]=useState({name:"",phone:"",email:"",fuerza:"5ta Fuerza",gender:"Varonil",birthdate:"",notes:"",assignedCoachId:""});
  const [saving,setSaving]=useState(false); const [toast,setToast]=useState("");
  const [coaches,setCoaches]=useState([]); const [lastCreated,setLastCreated]=useState(null);
  const [subPlayerIds,setSubPlayerIds]=useState(new Set());
  const [mySubs,setMySubs]=useState([]);
  const [confirmSub,setConfirmSub]=useState(null);
  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(""),2500);};
  const loadPlayers=useCallback(async()=>{
    setLoading(true);
    const cutoff=new Date(Date.now()+48*3600000).toISOString().slice(0,10);
    const [data,chs,subs,ownSubs]=await Promise.all([
      sb.get(token,"players",`?club_id=eq.${CLUB_ID}&order=name.asc`),
      sb.get(token,"coaches",`?club_id=eq.${CLUB_ID}&inactive=eq.false&select=id,name,role&order=name.asc`),
      sb.get(token,"substitutions",`?assigned_coach_id=eq.${coachId}&status=eq.pending&session_date=lte.${cutoff}&select=player_id,session_date`),
      sb.get(token,"substitutions",`?titular_coach_id=eq.${coachId}&status=eq.pending&order=session_date.asc`),
    ]);
    setPlayers(Array.isArray(data)?data:[]);setCoaches(Array.isArray(chs)?chs:[]);
    setSubPlayerIds(new Set((Array.isArray(subs)?subs:[]).map(s=>s.player_id)));
    setMySubs(Array.isArray(ownSubs)?ownSubs:[]);
    setLoading(false);
  },[token,coachId]);
  useEffect(()=>{loadPlayers();},[loadPlayers]);
  const filtered=useMemo(()=>players.filter(p=>{
    if(!showInactive&&p.inactive) return false; if(showInactive&&!p.inactive) return false;
    const matchSearch=p.name.toLowerCase().includes(search.toLowerCase());
    const matchLevel=filterLevel==="Todos"||p.level===filterLevel;
    if(!matchSearch||!matchLevel) return false;
    if(coachRole==="admin") return true;
    const isOwn=p.primary_coach_id===coachId; const isSub=subPlayerIds.has(p.id)&&!isOwn;
    return isOwn||isSub;
  }),[players,search,filterLevel,showInactive,subPlayerIds,coachId,coachRole]);
  const ownPlayers=coachRole==="admin"?players:players.filter(p=>p.primary_coach_id===coachId||subPlayerIds.has(p.id));
  const activeCount=ownPlayers.filter(p=>!p.inactive).length; const inactiveCount=ownPlayers.filter(p=>p.inactive).length;
  const addPlayer=async()=>{
    if(!form.name.trim()){showToast("El nombre es obligatorio","error");return;}
    if(!form.assignedCoachId){showToast("Asigna un coach al alumno","error");return;}
    setSaving(true);
    const inviteCode=await generateUniqueInviteCode(token); const pin=String(Math.floor(1000+Math.random()*9000));
    await sb.post(token,"players",{club_id:CLUB_ID,primary_coach_id:form.assignedCoachId,name:form.name.trim(),phone:form.phone.trim()||null,email:form.email.trim()||null,level:form.fuerza,gender:form.gender,birthdate:form.birthdate||null,notes:form.notes.trim()||null,invite_code:inviteCode,invite_pin:pin,inactive:false});
    setSaving(false);setLastCreated({name:form.name.trim(),code:inviteCode,pin});
    setForm({name:"",phone:"",email:"",fuerza:"5ta Fuerza",gender:"Varonil",birthdate:"",notes:"",assignedCoachId:""});setShowAdd(false);loadPlayers();
  };
  return(
    <div style={{padding:"16px 16px 90px"}}>
      {toast.msg&&<Toast msg={toast.msg} type={toast.type}/>}
      {confirmSub&&(<div style={{position:"fixed",inset:0,background:"#000a",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}><div style={{background:C.card,borderRadius:16,padding:20,maxWidth:320,width:"100%",border:`1px solid ${C.border}`}}><div style={{fontSize:15,fontWeight:800,color:C.text,marginBottom:8}}>{confirmSub.title}</div><div style={{fontSize:12,color:C.muted,marginBottom:20,lineHeight:1.5}}>{confirmSub.message}</div><div style={{display:"flex",gap:8}}><button onClick={()=>setConfirmSub(null)} style={{...btnS,flex:1}}>Cancelar</button><button onClick={confirmSub.onConfirm} style={{...btnP,flex:1,background:C.danger,border:"none"}}>Confirmar</button></div></div></div>)}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div><div style={{fontSize:22,fontWeight:800,color:C.text}}>Alumnos</div><div style={{fontSize:12,color:C.muted}}>{activeCount} activos{inactiveCount>0?` · ${inactiveCount} inactivos`:""}</div></div>
        {coachRole==="admin"&&<button onClick={()=>setShowAdd(true)} style={{background:C.accent,color:C.bg,border:"none",borderRadius:12,padding:"8px 16px",fontWeight:800,fontSize:13,cursor:"pointer"}}>+ Nuevo</button>}
      </div>
      {/* Banner Mis Sustituciones */}
      {mySubs.length>0&&(<div style={{marginBottom:16}}><div style={{fontSize:11,fontWeight:700,color:C.warning,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>📅 Mis sustituciones activas</div>{mySubs.map(sub=>{const subPlayer=players.find(p=>p.id===sub.player_id);const subCoach=coaches.find(c=>c.id===sub.assigned_coach_id);const isPast=new Date(sub.session_date+"T23:59:59")<new Date();return(<div key={sub.id} style={{background:C.warning+"11",borderRadius:12,padding:12,border:`1px solid ${C.warning}44`,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div><div style={{fontSize:13,fontWeight:700,color:C.warning,marginBottom:2}}>{fmtDate(sub.session_date)}{isPast&&<span style={{fontSize:10,color:C.danger,marginLeft:6}}>⚠️ Pasada</span>}</div><div style={{fontSize:11,color:C.text,fontWeight:600}}>{subPlayer?.name||"Alumno"}</div><div style={{fontSize:11,color:C.muted}}>Sustituto: {subCoach?.name||"—"}</div>{sub.notes&&<div style={{fontSize:11,color:C.muted,marginTop:2}}>"{sub.notes}"</div>}</div><button onClick={()=>setConfirmSub({title:"¿Cancelar sustitución?",message:`Sustitución del ${fmtDate(sub.session_date)} para ${subPlayer?.name||"este alumno"} se eliminará.`,onConfirm:async()=>{await sb.delete(token,"substitutions",sub.id);loadPlayers();setConfirmSub(null);showToast("Sustitución cancelada");}})} style={{background:C.danger+"22",color:C.danger,border:`1px solid ${C.danger}44`,borderRadius:8,padding:"5px 10px",fontSize:10,fontWeight:700,cursor:"pointer",flexShrink:0,marginLeft:10}}>✕</button></div>);})}</div>)}
      <div style={{position:"relative",marginBottom:10}}><span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:15,color:C.muted}}>🔍</span><input placeholder="Buscar alumno..." value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,marginBottom:0,paddingLeft:36}}/></div>
      <div style={{display:"flex",gap:6,marginBottom:16,overflowX:"auto",paddingBottom:2}}>
        {["Todos",...FUERZAS].map(lvl=>(<button key={lvl} onClick={()=>setFilterLevel(lvl)} style={{padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:11,fontWeight:700,whiteSpace:"nowrap",background:filterLevel===lvl?C.accent:C.card,color:filterLevel===lvl?C.bg:C.muted}}>{lvl}</button>))}
        {inactiveCount>0&&<button onClick={()=>setShowInactive(v=>!v)} style={{padding:"5px 12px",borderRadius:20,border:`1px solid ${C.muted}44`,cursor:"pointer",fontSize:11,fontWeight:700,whiteSpace:"nowrap",background:showInactive?C.muted:C.card,color:showInactive?C.bg:C.muted}}>{showInactive?"← Activos":`Inactivos (${inactiveCount})`}</button>}
      </div>
      {lastCreated&&(<div style={{background:C.success+"22",borderRadius:16,padding:16,border:`1px solid ${C.success}44`,marginBottom:16}}><div style={{fontSize:14,fontWeight:700,color:C.success,marginBottom:8}}>✅ Alumno creado</div><div style={{fontSize:13,color:C.text,marginBottom:12}}>Comparte con <strong>{lastCreated.name}</strong> por WhatsApp:</div><div style={{background:C.bg,borderRadius:10,padding:"12px 16px",marginBottom:10,border:`1px solid ${C.border}`}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontSize:11,color:C.muted}}>Código</span><span style={{fontSize:20,fontWeight:800,color:C.accent,letterSpacing:"0.1em"}}>{lastCreated.code}</span></div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:11,color:C.muted}}>PIN</span><span style={{fontSize:20,fontWeight:800,color:C.blue,letterSpacing:"0.1em"}}>{lastCreated.pin}</span></div></div><button onClick={()=>setLastCreated(null)} style={btnS}>Entendido</button></div>)}
      {showAdd&&(<div style={{background:C.card,borderRadius:16,padding:16,border:`1px solid ${C.border}`,marginBottom:16}}>
        <div style={{fontSize:14,fontWeight:700,color:C.accent,marginBottom:12}}>Nuevo Alumno</div>
        <input placeholder="Nombre completo *" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} style={inp}/>
        <input placeholder="Celular (opcional)" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} type="tel" style={inp}/>
        <input placeholder="Email (opcional)" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} type="email" style={inp}/>
        <div style={{marginBottom:10}}><div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:600}}>CATEGORÍA</div><select value={form.fuerza} onChange={e=>setForm({...form,fuerza:e.target.value})} style={inp}>{FUERZAS.map(f=><option key={f}>{f}</option>)}</select></div>
        <div style={{marginBottom:10}}><div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:600}}>GÉNERO</div><div style={{display:"flex",gap:8,marginBottom:10}}>{GENEROS.map(g=>(<button key={g} onClick={()=>setForm({...form,gender:g})} style={{flex:1,padding:"9px",borderRadius:10,border:`1px solid ${form.gender===g?C.accent:C.border}`,background:form.gender===g?C.accent+"22":C.bg,color:form.gender===g?C.accent:C.muted,fontWeight:700,fontSize:13,cursor:"pointer"}}>{g}</button>))}</div></div>
        <div style={{marginBottom:10}}><div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:600}}>FECHA DE NACIMIENTO (opcional)</div><input type="date" value={form.birthdate} onChange={e=>setForm({...form,birthdate:e.target.value})} style={inp}/></div>
        <div style={{marginBottom:10}}><div style={{fontSize:11,color:C.muted,marginBottom:6,fontWeight:600}}>COACH ASIGNADO *</div><select value={form.assignedCoachId} onChange={e=>setForm({...form,assignedCoachId:e.target.value})} style={inp}><option value="">— Seleccionar coach —</option>{coaches.map(c=><option key={c.id} value={c.id}>{c.name}{c.role==="admin"?" (Admin)":""}</option>)}</select></div>
        <textarea placeholder="Notas iniciales (opcional)" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} rows={2} style={{...inp,resize:"none"}}/>
        <div style={{display:"flex",gap:8}}><button onClick={()=>setShowAdd(false)} style={{...btnS,flex:1}}>Cancelar</button><button onClick={addPlayer} disabled={saving} style={{...btnP,flex:1,opacity:saving?0.7:1}}>{saving?"Guardando...":"Guardar"}</button></div>
      </div>)}
      {loading&&<Spinner/>}
      {!loading&&activeCount===0&&!showInactive&&<div style={{textAlign:"center",padding:"40px 20px",color:C.muted}}><div style={{fontSize:40,marginBottom:12}}>🎾</div><div style={{fontSize:14}}>Aún no tienes alumnos.<br/>¡Agrega el primero!</div></div>}
      {!loading&&filtered.length===0&&players.length>0&&<div style={{textAlign:"center",padding:"30px 20px",color:C.muted}}><div style={{fontSize:32,marginBottom:8}}>🔍</div><div style={{fontSize:13}}>Sin resultados</div></div>}

        </div>);
      })}
    </div>
  );
}

// ── EVAL TAB ─────────────────────────────────────────────────────────────────
function EvalTab({token,coachId,coachRole,onGoToPlayer}) {
  const [players,setPlayers]=useState([]); const [loading,setLoading]=useState(true); const [search,setSearch]=useState("");
  const [subPlayerIds,setSubPlayerIds]=useState(new Set());
  useEffect(()=>{
    const cutoff=new Date(Date.now()+48*3600000).toISOString().slice(0,10);
    Promise.all([
      sb.get(token,"players",`?club_id=eq.${CLUB_ID}&inactive=eq.false&order=name.asc`),

// ── CONFIG TAB ────────────────────────────────────────────────────────────────
function SuperAdminPanel({token}) {
  const [clubs,setClubs]=useState([]); const [loading,setLoading]=useState(true);
  const [showAdd,setShowAdd]=useState(false);
  const [form,setForm]=useState({clubName:"",adminName:"",adminEmail:""});
  const [saving,setSaving]=useState(false); const [toast,setToast]=useState("");
  const [createdInfo,setCreatedInfo]=useState(null);
  const [copied,setCopied]=useState(false);
  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(""),4000);};
  const load=useCallback(async()=>{setLoading(true);const data=await sb.get(token,"clubs",`?order=created_at.desc`);setClubs(Array.isArray(data)?data:[]);setLoading(false);},[token]);
  useEffect(()=>{load();},[load]);
  const createClub=async()=>{
    if(!form.clubName.trim()){showToast("El nombre del club es obligatorio","error");return;}
    if(!form.adminName.trim()){showToast("El nombre del admin es obligatorio","error");return;}
    if(!form.adminEmail.trim()){showToast("El email del admin es obligatorio","error");return;}
    setSaving(true);
    try{
      const createdClub=await sb.post(token,"clubs",{name:form.clubName.trim()});
      const newClub=Array.isArray(createdClub)?createdClub[0]:createdClub;
      if(!newClub?.id){showToast("No se pudo crear el club","error");setSaving(false);return;}
      const createdCoach=await sb.post(token,"coaches",{club_id:newClub.id,name:form.adminName.trim(),email:form.adminEmail.trim(),role:"admin",inactive:false});
      const newCoach=Array.isArray(createdCoach)?createdCoach[0]:createdCoach;
      if(!newCoach?.id){showToast("Club creado, pero falló crear el coach admin","error");setSaving(false);load();return;}
      const r=await fetch(`${SUPABASE_URL}/functions/v1/create-coach-auth`,{
        method:"POST",
        headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`},
        body:JSON.stringify({email:form.adminEmail.trim(),coach_id:newCoach.id})
      });
      const authResult=await r.json();
      if(!r.ok||authResult.error){
        showToast(`Club y admin creados, pero falló su acceso: ${authResult.error||"error desconocido"}`,"error");
      } else {
        setCreatedInfo({clubName:form.clubName.trim(),adminName:form.adminName.trim(),adminEmail:form.adminEmail.trim(),tempPassword:authResult.temp_password});
      }
    }catch(e){
      showToast("Error: "+e.message,"error");
    }
    setSaving(false);setForm({clubName:"",adminName:"",adminEmail:""});setShowAdd(false);load();
  };
  const copyPassword=()=>{
    if(!createdInfo) return;
    navigator.clipboard?.writeText(createdInfo.tempPassword).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  };
  return(
    <div style={{background:C.card,borderRadius:16,padding:16,border:`1px solid ${C.purple}44`,marginBottom:16}}>
      {toast.msg&&<Toast msg={toast.msg} type={toast.type}/>}
      {createdInfo&&(
        <div style={{background:C.success+"18",border:`1px solid ${C.success}66`,borderRadius:14,padding:16,marginBottom:14}}>
          <div style={{fontSize:14,fontWeight:800,color:C.success,marginBottom:8}}>✅ Club "{createdInfo.clubName}" creado</div>
          <div style={{fontSize:12,color:C.text,marginBottom:10,lineHeight:1.5}}>Comparte estos datos con <strong>{createdInfo.adminName}</strong> ({createdInfo.adminEmail}). Esta contraseña <strong>no se vuelve a mostrar</strong> — si se pierde, puede resetearla desde "¿Olvidaste tu contraseña?" en el login.</div>
          <div style={{display:"flex",alignItems:"center",gap:8,background:C.bg,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px",marginBottom:12}}>
            <span style={{fontFamily:"monospace",fontSize:15,fontWeight:800,color:C.accent,flex:1,wordBreak:"break-all"}}>{createdInfo.tempPassword}</span>
            <button onClick={copyPassword} style={{background:C.accent,color:C.bg,border:"none",borderRadius:8,padding:"6px 10px",fontSize:11,fontWeight:700,cursor:"pointer",flexShrink:0}}>{copied?"✓ Copiada":"Copiar"}</button>
          </div>
          <button onClick={()=>setCreatedInfo(null)} style={{...btnS,width:"100%"}}>Ya la guardé, cerrar</button>
        </div>
      )}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:14,fontWeight:700,color:C.purple}}>🌐 Súper Admin — Clubes</div>
        <button onClick={()=>setShowAdd(s=>!s)} style={{background:C.purple,color:"#fff",border:"none",borderRadius:10,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>{showAdd?"Cancelar":"+ Club"}</button>
      </div>
      {showAdd&&(
        <div style={{background:C.bg,borderRadius:12,padding:12,border:`1px solid ${C.border}`,marginBottom:14}}>
          <input placeholder="Nombre del club" value={form.clubName} onChange={e=>setForm({...form,clubName:e.target.value})} style={inp}/>
          <input placeholder="Nombre del primer admin" value={form.adminName} onChange={e=>setForm({...form,adminName:e.target.value})} style={inp}/>
          <input placeholder="Email del primer admin" value={form.adminEmail} onChange={e=>setForm({...form,adminEmail:e.target.value})} type="email" style={inp}/>
          <div style={{background:C.warning+"11",borderRadius:10,padding:"8px 12px",marginBottom:12,fontSize:11,color:C.warning,lineHeight:1.5}}>ℹ️ Se creará el club, su primer coach admin, y su acceso con contraseña temporal — cópiala del mensaje de confirmación para compartírsela.</div>
          <button onClick={createClub} disabled={saving} style={{...btnP,width:"100%",opacity:saving?0.7:1}}>{saving?"Creando...":"Crear club"}</button>
        </div>
      )}
      {loading?<Spinner/>:clubs.length===0?<div style={{fontSize:12,color:C.muted,textAlign:"center",padding:12}}>Sin clubes registrados aún.</div>:(
        <div>{clubs.map(c=>(<div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}`,fontSize:13,color:C.text}}><span>{c.name}</span><span style={{fontSize:11,color:C.muted}}>{c.id===CLUB_ID?"(este club)":""}</span></div>))}</div>
      )}
    </div>
  );
}
function ConfigTab({token,coach,coachRole,thresholds,onThresholdsUpdate,coachName,clubName,onSignOut,onCoachUpdate}) {
  const [local,setLocal]=useState(()=>JSON.parse(JSON.stringify(thresholds)));
